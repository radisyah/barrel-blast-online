<!DOCTYPE html>
<html lang="id">
<head>

<title>BARREL BLAST — Retro Math Rivalry</title>
<style>
  :root { --pad-h: clamp(128px, 34vh, 210px); }
  html, body { margin: 0; height: 100%; background: #0b0b1a; overflow: hidden; overscroll-behavior: none; }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; order: 1; }
  canvas {
    display: block; width: 100%; height: 100%; object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #14142b;
    outline: none;
  }
  /* Tombol utilitas (jeda, suara, layar penuh): kecil & transparan di tepi kanan-tengah, di atas arena (arena memenuhi layar) */
  #util { display: none; position: absolute; right: max(6px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
    flex-direction: column; gap: 6px; z-index: 5; opacity: .6; }
  body.touch #util { display: flex; }
  #util .ub { height: 34px; }
  }
  #util .ub {
    width: 38px; height: 30px; padding: 0; border: 2px solid #ffd23f; border-radius: 6px;
    background: rgba(11,11,26,.78); color: #ffd23f; font: bold 13px "Courier New", monospace; touch-action: none;
  }
  #util .ub:active { background: #ffd23f; color: #000; }
  #util .ub.off { color: #777; border-color: #777; text-decoration: line-through; }
  #rot {
    display: none; position: absolute; left: 6px; right: 6px; top: 6px; z-index: 6; text-align: center;
    background: rgba(11,11,26,.88); color: #ffd23f; border: 2px solid #ff8a3d; border-radius: 6px;
    font: bold 12px "Courier New", monospace; padding: 5px 8px; touch-action: manipulation;
  }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  /* Kontrol sentuh: hanya tampil pada perangkat sentuh. Mengambang di atas arena (layar penuh),
     transparan agar permainan tetap terlihat. Setiap pemain: joystick + tombol LOMPAT/AKSI. */
  #pad { display: none; }
  body.touch #pad { display: block; position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: 4; }
  .cluster {
    position: absolute; display: flex; align-items: flex-end; gap: 14px; pointer-events: none;
    bottom: max(10px, env(safe-area-inset-bottom));
  }
  .cluster[data-player="0"] { --c: #ff4d4d; left: max(12px, env(safe-area-inset-left)); }
  .cluster[data-player="1"] { --c: #4da6ff; right: max(12px, env(safe-area-inset-right)); flex-direction: row-reverse; }
  .cluster .lbl { display: none; }
  .joy {
    --s: clamp(88px, 27vh, 132px);
    position: relative; width: var(--s); height: var(--s); border-radius: 50%; flex: 0 0 auto;
    border: 2px solid var(--c); background: radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,.04) 70%);
    opacity: .6; pointer-events: auto; touch-action: none;
  }
  .joy::after { content: ""; position: absolute; left: -22px; top: -22px; right: -22px; bottom: -22px; }   /* area sentuh lebih luas */
  .joy i { position: absolute; color: var(--c); font: normal 14px "Courier New", monospace; opacity: .7; pointer-events: none; }
  .joy .a-u { left: 50%; top: 6%; transform: translateX(-50%); }
  .joy .a-d { left: 50%; bottom: 6%; transform: translateX(-50%); }
  .joy .a-l { left: 7%; top: 50%; transform: translateY(-50%); }
  .joy .a-r { right: 7%; top: 50%; transform: translateY(-50%); }
  .joy .knob {
    position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; margin: -22% 0 0 -22%; border-radius: 50%;
    background: var(--c); opacity: .6; border: 2px solid rgba(255,255,255,.55);
    transform: translate(var(--kx, 0px), var(--ky, 0px)); pointer-events: none;
  }
  .joy.on .knob { opacity: .9; }
  .acts { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; padding-bottom: 4px; }
  .cluster[data-player="0"] .acts { align-items: flex-start; }
  .cluster[data-player="1"] .acts { align-items: flex-end; }
  .tb {
    --bs: clamp(50px, 15vh, 72px);
    width: var(--bs); height: var(--bs); border-radius: 50%; border: 2px solid var(--c);
    background: rgba(255,255,255,.10); color: #fff; opacity: .65; pointer-events: auto;
    font: bold 12px "Courier New", monospace; padding: 0; touch-action: none;
  }
  .tb.on { background: var(--c); color: #000; opacity: 1; }
  @media (orientation: portrait) { body.touch #rot:not(.gone) { display: block; } }

  /* ===== ONLINE: satu perangkat = satu pemain. Joystick kiri; LOMPAT + SOAL kanan ===== */
  body.online #pad .cluster[data-player="1"] { display: none; }
  body.online #pad .cluster[data-player="0"] {
    left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right));
    justify-content: space-between; gap: 0;
  }
  body.online #pad .cluster[data-player="0"] .acts { flex-direction: column-reverse; align-items: flex-end; gap: 12px; padding-bottom: 6px; }
  body.online #pad .tb { --bs: clamp(52px, min(20vh, calc((100vw - 216.22vh) / 2 - 18px)), 88px); font-size: 13px; opacity: .75; }
  body.online #pad .joy { --s: clamp(76px, min(30vh, calc((100vw - 216.22vh) / 2 - 18px)), 144px); }
  body.online.guest #pad .cluster[data-player="0"] { --c: #4da6ff; }
  #lobby { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(8,8,24,.86); }
  #lobby.hidden, #ping.hidden, .hidden { display: none !important; }
  .lcard { width: min(420px, 92vw); max-height: 94vh; overflow: auto; padding: 18px 20px; box-sizing: border-box; text-align: center;
    background: #0b0b1a; border: 3px solid #ffd23f; border-radius: 8px; color: #fff; font: bold 14px "Courier New", monospace;
    -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .lcard h2 { margin: 0 0 12px; color: #ffd23f; font-size: 22px; letter-spacing: 2px; }
  .lcard input { width: 100%; box-sizing: border-box; margin: 5px 0; padding: 10px; font: bold 16px "Courier New", monospace; text-align: center;
    background: #14142b; color: #fff; border: 2px solid #4da6ff; border-radius: 6px; text-transform: uppercase; }
  .lcard button { width: 100%; margin: 5px 0; padding: 11px; font: bold 15px "Courier New", monospace; color: #000; background: #7dff7a;
    border: 0; border-radius: 6px; touch-action: manipulation; }
  .lcard button.alt { background: #ffd23f; } .lcard button.dim { background: #333; color: #aaa; }
  .lcard button.master { background: #c28cff; }
  .lcard button:disabled { opacity: .4; }
  /* Room Master = penonton + wasit: tidak ada kontrol sentuh */
  body.master #pad { display: none !important; }
  .lcard .or { margin: 8px 0 2px; color: #9aa; font-size: 12px; }
  #l-codebig { font-size: 40px; letter-spacing: 8px; color: #7dff7a; margin: 6px 0; }
  #l-status { min-height: 36px; margin: 8px 0; color: #ffd23f; white-space: pre-line; font-size: 13px; } #l-status.ok { color: #7dff7a; } #l-status.bad { color: #ff6b6b; }
  #ping { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(4px, env(safe-area-inset-bottom)); z-index: 6; padding: 2px 6px;
    font: bold 11px "Courier New", monospace; color: #7dff7a; background: rgba(11,11,26,.7); border-radius: 4px; pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40; max-width: 90vw; padding: 8px 14px; display: none;
    font: bold 13px "Courier New", monospace; color: #fff; background: #b02a2a; border: 2px solid #ffd23f; border-radius: 6px; }
  #toast.on { display: block; }
</style>

<script>
'use strict';
/* =====================================================================
   BARREL BLAST — Tahap 1: Fondasi, Canvas, Menu, Gerakan Dua Pemain
                  Tahap 2: Platform bertingkat, Tangga, Collision, Tong, Terkena Rintangan
                  Tahap 3: Soal matematika, Gerbang, Reward, Konsekuensi ringan
                  Tahap 4: Skor, Collectible, Timer, HUD, Garis akhir, Menang/Seri, Layar hasil
                  Tahap 5: Pixel art 16-bit, sprite & animasi, partikel, efek suara, kontrol sentuh
                  Tahap 6: Audit & optimasi (cache teks, lapisan level statis), pengujian, build final
                  Tahap 7: Matematika wajib (semua tangga bergerbang, kombo), boss gorila, api, tong tangga
   Struktur: CONFIG -> GFX/FONT/SFX/FX -> INPUT -> LEVEL -> PHYSICS -> BARRELS -> QUIZ -> GATES -> SCORE/MATCH -> UI/STATE -> RENDER -> LOOP
   ===================================================================== */

/* ---------------------------- CONFIG ---------------------------- */
const CONFIG = {
  W: 1600, H: 740, TOP: 0, FLOOR: 700,   // TOP = 0: tidak ada strip soal lagi; arena memenuhi seluruh kanvas (1600x740) dan panel soal tampil di tengah arena
   // arena panjang (~2,16:1, bukan 4:3): lantai + 6 tingkat platform
  STEP: 1 / 120,            // fixed timestep fisika (detik)
  MAX_FRAME: 0.1,           // batas dt per frame agar tidak spiral
  GRAVITY: 1700,
  MOVE_ACCEL: 2200,
  MOVE_FRICTION: 2600,
  AIR_CONTROL: 0.65,
  MAX_SPEED: 230,
  JUMP_V: 560,              // puncak lompatan ~92 px < jarak antar-tingkat (100 px): tangga wajib dipakai
  MAX_FALL: 900,
  JUMP_BUFFER: 0.12,        // detik toleransi tekan lompat sebelum mendarat
  COYOTE: 0.08,             // detik toleransi lompat setelah meninggalkan tepi
  COUNTDOWN: 3,
  PLAYER_W: 24, PLAYER_H: 34,
  // Tangga
  LADDER_W: 28,
  LADDER_GRAB: 12,          // toleransi horizontal (px) dari tengah tangga untuk meraih
  CLIMB_SPEED: 120,
  LADDER_JUMP: 0.7,         // skala kecepatan saat melompat lepas dari tangga
  // Terkena tong
  HIT_STUN: 0.5,            // detik tak bisa dikontrol
  INVULN: 1.2,              // detik kebal setelah terkena (pemain berkedip)
  KNOCK_X: 200, KNOCK_Y: 320,
  // Tong
  BARREL_R: 11,
  BARREL_POOL: 24,          // object pool: tidak ada alokasi baru di dalam game loop
  BARREL_GRAVITY: 0.8,      // skala gravitasi tong
  BARREL_AIR_DRIFT: 0.35,   // skala kecepatan horizontal saat tong jatuh dari tepi
  // Reward & konsekuensi gerbang matematika
  BOOST_TIME: 8, BOOST_MULT: 1.35,      // TURBO: lebih cepat
  SHIELD_TIME: 10,                      // PERISAI: tong hancur tanpa melukai
  SLOW_TIME: 2.5, SLOW_MULT: 0.65,      // konsekuensi ringan jawaban salah: melambat sebentar
  // Gaya Donkey Kong: palu, lompati tong
  HAMMER_TIME: 10, HAMMER_RESPAWN: 40,
  SMASH_BARREL: 300, SMASH_FLAME: 500,
  JUMP_OVER: [100, 300, 800],           // lompati 1, 2, 3 tong dalam satu lompatan
  // Skor, collectible, hasil pertandingan
  COIN_VALUE: 10, GEM_VALUE: 50,
  COIN_R: 8, GEM_R: 10,
  COIN_RESPAWN: 25, GEM_RESPAWN: 45,    // detik sampai collectible muncul lagi setelah diambil
  FINISH_BONUS: 500, TIME_BONUS_PER_SEC: 5,
  // Kombo: jawaban benar beruntun menaikkan pengali SEMUA koin/gem (x1..x5); pecah bila salah, kena rintangan, atau diam terlalu lama
  COMBO_MAX: 5, COMBO_TIME: 30,
  POPUPS: 24,                           // pool teks melayang "+10" (tanpa alokasi saat bermain)
  RESULT_LOCK: 1.0                      // detik input layar hasil diabaikan (cegah salah pencet)
};

const UI_W = 960;                       // menu/jeda/hasil dirancang 960x540: dipusatkan di arena yang lebih lebar & tinggi
const UI_OFF = (CONFIG.H - 540) / 2;
const UI_OFFX = (CONFIG.W - UI_W) / 2;
const DIFFICULTIES = ['MUDAH', 'SEDANG', 'SULIT'];
const DURATIONS = [90, 120, 150, 300, 600];   // detik: 90 dtk ... 5 menit, 10 menit
const durLabel = d => (d % 60 === 0 ? (d / 60) + ' MENIT' : d + ' DETIK');

// Kesulitan memengaruhi tong: kecepatan gulir (px/detik) dan jeda antar kemunculan (detik)
const BARREL_SPEED = [125, 160, 195];
const BARREL_INTERVAL = [2.7, 2.0, 1.5];

// Boss gorila & api (rintangan ala Donkey Kong), per kesulitan
const RAGE_FIRST = [18, 13, 10];                       // detik sampai amukan pertama
const RAGE_EVERY = [22, 17, 13];                       // jeda antar amukan
const RAGE_VOLLEY = [['fast', 'ladder', 'fast', 'ladder'], ['fast', 'ladder', 'fast', 'ladder', 'fast'], ['fast', 'ladder', 'fast', 'ladder', 'fast', 'ladder', 'fast']];
const FLAME_SPEED = [44, 58, 74];
const FLAME_MAX = [3, 4, 4];
const FLAME_FIRST = [10, 7, 5];                       // detik sampai api pertama (bila belum ada tong yang menyulut drum)
const FLAME_EVERY = [15, 11, 8];
const LADDER_CHANCE = [0.12, 0.2, 0.3];                // peluang tong biasa ikut menuruni tangga (seperti Donkey Kong)

// Batas waktu menjawab satu soal (detik), dapat dipilih di menu
const QTIMES = [10, 15, 20];

const settings = { difficulty: 1, duration: 1, qtime: 1 }; // indeks; durasi dipakai penuh di tahap berikutnya

/* ---------------------------- GFX (pabrik sprite offscreen) ---------------------------- */
/* Seluruh seni piksel dibuat secara prosedural saat start (tanpa gambar eksternal), digambar kecil
   di kanvas offscreen lalu diperbesar tajam (nearest-neighbour) sehingga tampak seperti piksel 16-bit.
   Di lingkungan tanpa DOM (uji headless) pabrik ini mengembalikan kanvas kosong yang aman. */
const Gfx = (() => {
  function make(w, h) {
    if (typeof document !== 'undefined' && document.createElement) {
      const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
    }
    return { width: w, height: h, getContext: () => null };
  }
  function ctxOf(c) {
    const g = c.getContext && c.getContext('2d');
    if (g) g.imageSmoothingEnabled = false;
    return g;
  }
  /* Buat sprite w x h dan isi lewat fn(g, px) dengan px(warna, x, y, lebar, tinggi) = kotak piksel. */
  function sprite(w, h, fn) {
    const c = make(w, h), g = ctxOf(c);
    if (g) fn(g, (col, x, y, ww, hh) => { g.fillStyle = col; g.fillRect(x, y, ww || 1, hh || 1); });
    return c;
  }
  /* Perbesar n kali tanpa penghalusan. */
  function scale(src, n) {
    const c = make(src.width * n, src.height * n), g = ctxOf(c);
    if (g) g.drawImage(src, 0, 0, src.width * n, src.height * n);
    return c;
  }
  /* Tambah kontur 1 piksel (warna gelap) di sekeliling bagian tidak transparan; ukuran +2 di tiap sisi. */
  function outline(src, color) {
    const w = src.width, h = src.height, sg = src.getContext && src.getContext('2d');
    const c = make(w + 2, h + 2), g = ctxOf(c);
    if (!g || !sg) return src;
    const d = sg.getImageData(0, 0, w, h).data;
    const a = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
    g.fillStyle = color;
    for (let y = -1; y <= h; y++) {
      for (let x = -1; x <= w; x++) {
        if (a(x, y) === 0 && (a(x - 1, y) > 0 || a(x + 1, y) > 0 || a(x, y - 1) > 0 || a(x, y + 1) > 0)) g.fillRect(x + 1, y + 1, 1, 1);
      }
    }
    g.drawImage(src, 1, 1);
    return c;
  }
  return { make, ctxOf, sprite, scale, outline };
})();

/* ---------------------------- FONT (bitmap 5x7) ---------------------------- */
/* Huruf piksel buatan sendiri. Tiap karakter = 7 baris x 5 bit (2 digit heks per baris).
   Huruf kecil dipetakan ke huruf besar. Atlas per warna dibuat sekali lalu dipakai ulang. */
const Font = (() => {
  const DEF = {
    'A': '0E11111F111111', 'B': '1E11111E11111E', 'C': '0E11101010110E', 'D': '1E11111111111E',
    'E': '1F10101E10101F', 'F': '1F10101E101010', 'G': '0E11101711110F', 'H': '1111111F111111',
    'I': '0E04040404040E', 'J': '0702020202120C', 'K': '11121418141211', 'L': '1010101010101F',
    'M': '111B1515111111', 'N': '11191513111111', 'O': '0E11111111110E', 'P': '1E11111E101010',
    'Q': '0E11111115120D', 'R': '1E11111E141211', 'S': '0F10100E01011E', 'T': '1F040404040404',
    'U': '1111111111110E', 'V': '11111111110A04', 'W': '1111111515150A', 'X': '11110A040A1111',
    'Y': '11110A04040404', 'Z': '1F01020408101F',
    '0': '0E11131519110E', '1': '040C040404040E', '2': '0E11010204081F', '3': '1F02040201110E',
    '4': '02060A121F0202', '5': '1F101E0101110E', '6': '0608101E11110E', '7': '1F010204080808',
    '8': '0E11110E11110E', '9': '0E11110F01020C',
    ' ': '00000000000000', '.': '00000000000C0C', ',': '000000000C0408', ':': '000C0C000C0C00',
    '!': '04040404040004', '?': '0E110102040004', '-': '0000001F000000', '+': '0004041F040400',
    '=': '00001F001F0000', '/': '01010204081010', '%': '18190204081303', '(': '02040808080402',
    ')': '08040202020408', '<': '02040810080402', '>': '08040201020408', '[': '0E08080808080E',
    ']': '0E02020202020E', "'": '04040800000000', '*': '00150E1F0E1500', '_': '0000000000001F',
    '×': '00110A040A1100', '÷': '0004001F000400', '#': '0A0A1F0A1F0A0A', '^': '040A1100000000'
  };
  const KEYS = Object.keys(DEF), idx = {};
  KEYS.forEach((k, i) => { idx[k] = i; });
  const ROWS = KEYS.map(k => {
    const h = DEF[k], r = [];
    for (let i = 0; i < 7; i++) r.push(parseInt(h.substr(i * 2, 2), 16));
    return r;
  });
  const atlases = {};
  function atlas(color) {
    let a = atlases[color];
    if (a) return a;
    a = Gfx.sprite(KEYS.length * 6, 7, (g, px) => {
      for (let i = 0; i < ROWS.length; i++) {
        for (let y = 0; y < 7; y++) {
          const bits = ROWS[i][y];
          for (let x = 0; x < 5; x++) if (bits & (16 >> x)) px(color, i * 6 + x, y);
        }
      }
    });
    atlases[color] = a;
    return a;
  }
  const glyph = ch => { const c = ch.toUpperCase(); return (c in idx) ? idx[c] : idx['?']; };
  function width(str, sc) { return str.length ? str.length * 6 * sc - sc : 0; }
  function drawRaw(ctx, str, x, y, sc, color) {
    const at = atlas(color);
    for (let i = 0; i < str.length; i++) {
      const gi = glyph(str.charAt(i));
      if (gi === idx[' ']) continue;
      ctx.drawImage(at, gi * 6, 0, 5, 7, x + i * 6 * sc, y, 5 * sc, 7 * sc);
    }
  }
  /* Teks dipanggang sekali menjadi satu kanvas kecil per (skala, warna, string) sehingga satu string = satu
     drawImage, bukan satu per huruf. Cache dibatasi dan dikosongkan bila penuh (string yang berubah tiap frame,
     mis. timer, hanya menghasilkan beberapa kanvas per detik). */
  const baked = new Map(), BAKE_MAX = 400;
  function bake(str, sc, color) {
    const c = Gfx.make(width(str, sc), 7 * sc), g = Gfx.ctxOf(c);
    if (!g) return null;
    drawRaw(g, str, 0, 0, sc, color);
    return c;
  }
  /* x,y = pojok kiri atas; sc = skala bulat (>=1). */
  function draw(ctx, str, x, y, sc, color) {
    if (str.length > 1) {
      const key = sc + '|' + color + '|' + str;
      let c = baked.get(key);
      if (c === undefined) {
        c = bake(str, sc, color);
        if (baked.size >= BAKE_MAX) baked.clear();
        baked.set(key, c);
      }
      if (c) { ctx.drawImage(c, Math.round(x), Math.round(y)); return; }
    }
    drawRaw(ctx, str, x, y, sc, color);
  }
  return { width, draw, glyph, KEYS, ROWS, cacheSize: () => baked.size };
})();

/* ---------------------------- SFX (Web Audio, tanpa aset) ---------------------------- */
/* Efek suara chiptune disintesis dari osilator + derau. Konteks audio baru dibuat/dilanjutkan saat
   gestur pengguna pertama (kebijakan autoplay browser). Bila Web Audio tidak ada atau diblokir,
   semua panggilan menjadi senyap tanpa error (fallback). Bisu disimpan di localStorage (opsional). */
const SFX = (() => {
  const W = typeof window !== 'undefined' ? window : null;
  const AC = W && (W.AudioContext || W.webkitAudioContext);
  let ac = null, master = null, mus = null, noiseBuf = null, voices = 0, muted = false, failed = false;
  try { muted = typeof localStorage !== 'undefined' && localStorage.getItem('bb_mute') === '1'; } catch (_) { muted = false; }

  function ensure() {
    if (!AC || failed) return false;
    if (!ac) {
      try {
        ac = new AC();
        master = ac.createGain(); master.gain.value = 0.45; master.connect(ac.destination);
        mus = ac.createGain(); mus.gain.value = 0; mus.connect(master); musicApply(true);
      } catch (_) { ac = null; failed = true; return false; }
    }
    if (ac.state === 'suspended') { try { ac.resume(); } catch (_) {} }
    return true;
  }
  function tone(freq, dur, type, vol, slide, delay) {
    if (!ac || voices > 16) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    voices++;
    o.onended = () => { voices--; try { g.disconnect(); } catch (_) {} };
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, cutoff, delay) {
    if (!ac || voices > 16) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ac.currentTime + (delay || 0);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = cutoff || 1200;
    g.gain.setValueAtTime(vol || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    voices++;
    src.onended = () => { voices--; try { g.disconnect(); } catch (_) {} };
    src.start(t0); src.stop(t0 + dur + 0.03);
  }
  const arp = (notes, step, type, vol) => notes.forEach((n, i) => tone(n, step * 1.6, type, vol, 0, i * step));

  const RECIPES = {
    jump:        () => tone(260, 0.13, 'square', 0.09, 560),
    land:        () => noise(0.06, 0.07, 500),
    climb:       () => tone(330, 0.03, 'square', 0.035),
    coin:        () => { tone(988, 0.05, 'square', 0.08); tone(1319, 0.13, 'square', 0.08, 0, 0.05); },
    gem:         () => arp([660, 880, 1109, 1319], 0.045, 'triangle', 0.12),
    hit:         () => { tone(220, 0.28, 'sawtooth', 0.12, 60); noise(0.18, 0.12, 900); },
    shieldBlock: () => { noise(0.09, 0.09, 2500); tone(700, 0.12, 'triangle', 0.1, 300); },
    correct:     () => arp([523, 659, 784, 1047], 0.07, 'square', 0.09),
    wrong:       () => { tone(200, 0.16, 'sawtooth', 0.1, 140); tone(150, 0.26, 'sawtooth', 0.1, 70, 0.14); },
    boost:       () => tone(300, 0.22, 'square', 0.09, 1000),
    shield:      () => { tone(500, 0.25, 'triangle', 0.12, 1100); tone(1500, 0.18, 'sine', 0.05, 0, 0.1); },
    slow:        () => tone(320, 0.22, 'sawtooth', 0.07, 120),
    panelOpen:   () => tone(520, 0.08, 'square', 0.07, 800),
    back:        () => tone(420, 0.06, 'square', 0.06, 300),
    move:        () => tone(620, 0.03, 'square', 0.05),
    confirm:     () => { tone(880, 0.05, 'square', 0.07); tone(1320, 0.09, 'square', 0.07, 0, 0.05); },
    pause:       () => { tone(500, 0.06, 'square', 0.06); tone(380, 0.08, 'square', 0.06, 0, 0.06); },
    resume:      () => { tone(380, 0.06, 'square', 0.06); tone(500, 0.08, 'square', 0.06, 0, 0.06); },
    beep:        () => tone(660, 0.12, 'square', 0.09),
    go:          () => tone(1320, 0.34, 'square', 0.1),
    tick:        () => tone(880, 0.04, 'square', 0.06),
    win:         () => arp([523, 523, 523, 659, 784, 659, 784, 1047], 0.09, 'square', 0.1),
    draw:        () => { tone(494, 0.18, 'triangle', 0.1); tone(392, 0.3, 'triangle', 0.1, 0, 0.18); },
    roar:        () => { tone(110, 0.55, 'sawtooth', 0.14, 55); noise(0.45, 0.12, 700); tone(82, 0.5, 'square', 0.08, 50, 0.1); },
    throw:       () => { noise(0.14, 0.08, 1800); tone(240, 0.12, 'square', 0.05, 120); },
    ignite:      () => { noise(0.22, 0.1, 2200); tone(400, 0.2, 'triangle', 0.07, 900); },
    flameOut:    () => { noise(0.18, 0.08, 900); tone(500, 0.12, 'sine', 0.05, 150); },
    sparkle:     () => tone(1568, 0.07, 'sine', 0.05)
  };


  /* ----- Musik latar retro (sequencer chiptune, disintesis; tanpa aset) -----
     A minor, progresi Am-F-C-G, 8 bar berulang: bass kotak, arpeggio, melodi lead, drum derau.
     Penjadwalan lookahead lewat jam AudioContext sehingga ritme stabil. Mengikuti tombol suara (N). */
  let musMode = 'off', musStep = 0, musNext = 0, musTimer = 0;
  const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
  const BASS_ROOT = [45, 41, 48, 43];                         // A2 F2 C3 G2
  const BASS_PAT = [0, 0, 12, 0, 0, 0, 12, 7];                // per 8th note
  const ARP = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [59, 62, 67]];
  const ARP_IDX = [0, 1, 2, 1];
  const LEAD = [
    [76,0,0,0,72,0,76,0,81,0,0,0,79,0,76,0],
    [77,0,0,0,72,0,77,0,81,0,0,0,77,0,72,0],
    [79,0,0,0,76,0,72,0,76,0,79,0,84,0,0,0],
    [83,0,81,0,79,0,74,0,79,0,0,0,0,0,0,0]
  ];
  const MODES = { menu: { bpm: 108, drums: false, lead: true, vol: 0.8 },
                  play: { bpm: 148, drums: true,  lead: true, vol: 1 },
                  pause: { bpm: 148, drums: false, lead: false, vol: 0.18 } };

  function musicApply(instant) {
    if (!ac || !mus) return;
    const m = MODES[musMode];
    const target = (muted || !m) ? 0 : m.vol * 0.55;
    try {
      if (instant) mus.gain.value = target;
      else mus.gain.setTargetAtTime(target, ac.currentTime, 0.12);
    } catch (_) {}
  }
  function mTone(f, t0, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(mus);
    o.onended = () => { try { g.disconnect(); } catch (_) {} };
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function mKick(t0) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(42, t0 + 0.12);
    g.gain.setValueAtTime(0.28, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    o.connect(g); g.connect(mus);
    o.onended = () => { try { g.disconnect(); } catch (_) {} };
    o.start(t0); o.stop(t0 + 0.2);
  }
  function mNoise(t0, dur, vol, type, freq) {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(mus);
    src.onended = () => { try { g.disconnect(); } catch (_) {} };
    src.start(t0); src.stop(t0 + dur + 0.03);
  }
  function musicSchedule(step, t0, m) {
    const bar = Math.floor(step / 16) % 8, chord = bar % 4, s = step % 16;
    const sd = 60 / m.bpm / 4;                                 // durasi 1/16
    if (s % 2 === 0) {                                         // bass
      const n = BASS_ROOT[chord] + BASS_PAT[s / 2];
      mTone(mtof(n), t0, sd * 1.8, 'triangle', 0.2);
    }
    const a = ARP[chord];                                      // arpeggio cepat
    mTone(mtof(a[ARP_IDX[s % 4] % 3] + (s % 4 === 3 ? 12 : 0)), t0, sd * 0.9, 'square', bar >= 4 ? 0.035 : 0.05);
    if (m.lead && bar >= 4) {                                  // melodi masuk di bar 5-8
      const n = LEAD[chord][s];
      if (n) mTone(mtof(n), t0, sd * 3.2, 'square', 0.07);
    }
    if (m.drums) {
      if (s === 0 || s === 8 || (s === 6 && bar % 2 === 1)) mKick(t0);
      if (s === 4 || s === 12) mNoise(t0, 0.1, 0.12, 'bandpass', 2400);
      if (s % 2 === 0) mNoise(t0, 0.03, 0.04, 'highpass', 7000);
    }
  }
  function musicTick() {
    if (!ac || !mus || muted || ac.state !== 'running') return;
    const m = MODES[musMode];
    if (!m) return;
    const now = ac.currentTime;
    if (musNext < now) musNext = now + 0.05;                   // sehabis tertahan/ditangguhkan
    while (musNext < now + 0.14) {
      try { musicSchedule(musStep, musNext, m); } catch (_) {}
      musNext += 60 / m.bpm / 4;
      musStep = (musStep + 1) % 128;
    }
  }
  function musicMode(mode) {
    if (mode === musMode) return;
    musMode = mode;
    if (mode === 'off') { musStep = 0; }
    musicApply(false);
  }
  if (W && !musTimer) musTimer = setInterval(musicTick, 30);
  if (typeof document !== 'undefined') {
    document.addEventListener('visibilitychange', () => {
      if (!ac) return;
      try { if (document.hidden) ac.suspend(); else if (!failed) ac.resume(); } catch (_) {}
    });
  }

  function play(name) {
    if (muted || !ensure()) return;
    const r = RECIPES[name];
    if (r) { try { r(); } catch (_) {} }
  }
  function unlock() { ensure(); }
  function toggle() {
    muted = !muted;
    try { if (typeof localStorage !== 'undefined') localStorage.setItem('bb_mute', muted ? '1' : '0'); } catch (_) {}
    musicApply(false);
    if (!muted) play('confirm');
    return muted;
  }
  /* 'unsupported' = tidak ada Web Audio / gagal dibuat; 'off' = dibisukan; 'on' = aktif. */
  function status() { return (!AC || failed) ? 'unsupported' : (muted ? 'off' : 'on'); }

  if (W && W.addEventListener) {
    ['keydown', 'pointerdown', 'touchstart'].forEach(ev => W.addEventListener(ev, unlock, { passive: true }));
  }
  return { play, toggle, status, unlock, musicMode, isMuted: () => muted };
})();

/* ---------------------------- FX (partikel & peristiwa visual/suara) ---------------------------- */
/* Pool partikel tetap (tanpa alokasi saat bermain). Efek ini murni visual: memakai Math.random dan
   dt layar, TIDAK memengaruhi simulasi (skor, fisika, soal tetap deterministik dan bebas FPS).
   FX.event(...) adalah satu pintu untuk memicu partikel + suara + getar/guncangan layar. */
const FX = (() => {
  const N = 240, P = [];
  for (let i = 0; i < N; i++) P.push({ a: false, x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0, max: 1, size: 2, color: '#fff' });
  let next = 0, shakeT = 0, shakeMag = 0, flashT = 0, flashMax = 1, flashColor = '#fff';
  const off = { x: 0, y: 0 };
  const rnd = (a, b) => a + Math.random() * (b - a);

  function spawn(x, y, vx, vy, g, life, size, color) {
    const q = P[next]; next = (next + 1) % N;          // cincin: menimpa yang tertua
    q.a = true; q.x = x; q.y = y; q.vx = vx; q.vy = vy; q.g = g; q.life = life; q.max = life; q.size = size; q.color = color;
  }
  function burst(x, y, n, colors, speed, life, g, size) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = speed * (0.35 + Math.random() * 0.65);
      spawn(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp - speed * 0.25, g, life * rnd(0.6, 1.1), size, colors[i % colors.length]);
    }
  }
  function dust(x, y, n, k) {
    for (let i = 0; i < n; i++) spawn(x + rnd(-9, 9), y - 1, rnd(-50, 50) * k, -rnd(8, 40) * k, 90, rnd(0.25, 0.45), 2, '#cfc9d8');
  }
  function shake(t, mag) { if (mag >= shakeMag || shakeT <= 0) { shakeT = t; shakeMag = mag; } }
  function flash(color, t) { flashColor = color; flashT = t; flashMax = t; }
  function vibrate(ms) { try { if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(ms); } catch (_) {} }

  function update(dt) {
    for (const q of P) {
      if (!q.a) continue;
      q.life -= dt;
      if (q.life <= 0) { q.a = false; continue; }
      q.vy += q.g * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
    if (shakeT > 0) shakeT -= dt;
    if (flashT > 0) flashT -= dt;
  }
  function shakeOffset() {
    if (shakeT <= 0) { off.x = 0; off.y = 0; return off; }
    const m = shakeMag * Math.min(1, shakeT / 0.15);
    off.x = Math.round(rnd(-m, m)); off.y = Math.round(rnd(-m, m));
    return off;
  }
  function reset() { for (const q of P) q.a = false; shakeT = 0; flashT = 0; }

  function event(name, x, y, color) {
    Online.emit(name, x, y, color);                    // Room Master: teruskan ke pemain (efek, suara, percikan)
    switch (name) {
      case 'jump':        SFX.play('jump'); dust(x, y, 4, 0.7); break;
      case 'land':        SFX.play('land'); dust(x, y, 6, 1.1); break;
      case 'coin':        SFX.play('coin'); burst(x, y, 7, ['#ffd23f', '#fff3b0', '#ffffff'], 90, 0.45, 220, 2); break;
      case 'gem':         SFX.play('gem'); burst(x, y, 16, ['#ff5de0', '#ffd1f6', '#ffffff', '#6ef2ff'], 150, 0.65, 250, 2); break;
      case 'hit':         SFX.play('hit'); burst(x, y, 18, ['#ff4d4d', '#ff8a3d', '#ffd23f', '#ffffff'], 200, 0.6, 420, 3); if (!Online.master) { shake(0.3, 5); flash('#ff4d4d', 0.14); vibrate(45); } break;
      case 'barrelBreak': burst(x, y, 12, ['#8b5a2b', '#5a3515', '#c28a4a'], 150, 0.7, 520, 3); break;
      case 'shieldBlock': SFX.play('shieldBlock'); burst(x, y, 14, ['#6ef2ff', '#ffffff', '#9ad8ff'], 170, 0.5, 120, 2); break;
      case 'gateOpen':    SFX.play('correct'); burst(x, y, 24, [color || '#7dff7a', '#ffd23f', '#ffffff'], 180, 0.85, 200, 3); break;
      case 'gateWrong':   SFX.play('wrong'); burst(x, y, 10, ['#ff4d4d', '#8a1c1c'], 100, 0.5, 300, 3); vibrate(25); break;
      case 'boost':       SFX.play('boost'); burst(x, y, 12, ['#ffd23f', '#ff8a3d', '#ffffff'], 130, 0.5, 0, 2); break;
      case 'shield':      SFX.play('shield'); burst(x, y, 14, ['#6ef2ff', '#ffffff'], 120, 0.6, 0, 2); break;
      case 'slow':        SFX.play('slow'); break;
      case 'roar':        SFX.play('roar'); shake(1.2, 4); flash('#ff4d4d', 0.25); vibrate(80); break;
      case 'ignite':      SFX.play('ignite'); burst(x, y, 14, ['#ff8a3d', '#ffd23f', '#ff4d4d'], 120, 0.55, -40, 2); break;
      case 'flameOut':    SFX.play('flameOut'); burst(x, y, 10, ['#cfc9d8', '#8a8fa8', '#ff8a3d'], 70, 0.45, -30, 2); break;
      case 'confetti':    burst(x, y, 40, ['#ff4d4d', '#ffd23f', '#7dff7a', '#4da6ff', '#ff5de0', '#ffffff'], 260, 1.6, 260, 3); break;
      default: break;
    }
  }
  return { P, spawn, burst, dust, update, event, reset, shake, flash, shakeOffset, flashState: () => ({ t: flashT, max: flashMax, color: flashColor }) };
})();

/* ---------------------------- INPUT ---------------------------- */
const Input = (() => {
  const down = new Set();       // tombol yang sedang ditahan (berdasarkan e.code)
  const pressed = new Set();    // tombol yang baru ditekan sejak konsumsi terakhir
  const virt = new Set();       // tombol sentuh yang sedang ditahan (tetap aktif setelah clear())
  const latch = new Set();      // tekanan baru untuk simulasi; hanya dihapus setelah satu langkah fisika
                                // memakainya (frame tanpa langkah fisika tidak membuang tekanan lompat)
  const GAME_KEYS = new Set([
    'KeyA','KeyD','KeyW','KeyS','Space','KeyE',
    'ArrowLeft','ArrowRight','ArrowUp','ArrowDown','ShiftRight','Enter',
    'KeyP','Escape','KeyR','KeyM','KeyN'
  ]);

  function onKeyDown(e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    if (e.repeat) return;
    const c = Online.route(e.code, 1); if (!c) return;
    down.add(c); pressed.add(c); latch.add(c);
  }
  function onKeyUp(e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    const c = Online.route(e.code, 0); if (!c) return;
    down.delete(c);
  }
  function clear() {
    down.clear(); pressed.clear(); latch.clear();
    for (const c of virt) down.add(c);   // jari yang masih menahan tombol tidak "terputus"
  }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { virt.clear(); clear(); Game.onBlur(); });

  return {
    press: c => { c = Online.route(c, 1); if (!c) return; virt.add(c); down.add(c); pressed.add(c); latch.add(c); },
    release: c => { c = Online.route(c, 0); if (!c) return; virt.delete(c); down.delete(c); },
    inject: (c, d) => { if (d) { virt.add(c); down.add(c); pressed.add(c); latch.add(c); } else { virt.delete(c); down.delete(c); } },
    isDown: c => down.has(c),
    wasPressed: c => pressed.has(c),
    latched: c => latch.has(c),
    consumeLatch: c => latch.delete(c),
    clearLatch: () => latch.clear(),
    consume: c => pressed.delete(c),
    endFrame: () => pressed.clear(),
    clear
  };
})();

/* Pemetaan kontrol dua pemain */
const KEYMAP = [
  { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', jump: 'Space', act: 'KeyE' },
  { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', jump: 'ShiftRight', act: 'Enter' }
];

/* ---------------------------- TOUCH PAD ---------------------------- */
/* Tombol sentuh memakai Input.press/release dengan kode tombol yang sama seperti
   keyboard, sehingga fisika dan UI tidak perlu tahu sumber inputnya.
   Pointer Events + setPointerCapture memungkinkan multi-touch (dua pemain sekaligus). */
(function initTouchPad() {
  const enable = () => document.body.classList.add('touch');
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0 ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) enable();
  window.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') enable(); }, { passive: true });
  document.addEventListener('contextmenu', e => e.preventDefault());

  /* Satu pasang listener untuk semua jari. Setiap pointerId memegang paling banyak satu tombol;
     menggeser jari ke tombol lain memindahkan tekanan (tanpa harus mengangkat jari).
     Hitungan per tombol mencegah dua jari pada tombol sama saling melepas. */
  const owner = new Map();      // pointerId -> elemen tombol
  const count = new Map();      // kode tombol -> jumlah jari
  function hold(btn) {
    const k = btn.dataset.key, n = (count.get(k) || 0) + 1;
    count.set(k, n); btn.classList.add('on');
    if (n === 1) Input.press(k);
  }
  function drop(btn) {
    const k = btn.dataset.key, n = (count.get(k) || 1) - 1;
    if (n <= 0) { count.delete(k); Input.release(k); } else count.set(k, n);
    if (!(n > 0)) btn.classList.remove('on');
  }
  function moveTo(id, btn) {
    const old = owner.get(id);
    if (old === btn) return;
    if (old) drop(old);
    if (btn) { owner.set(id, btn); hold(btn); } else owner.delete(id);
  }
  const btnAt = (x, y) => {
    const el = document.elementFromPoint ? document.elementFromPoint(x, y) : null;
    const b = el && el.closest ? el.closest('#pad .tb') : null;
    return b || null;
  };
  /* Joystick analog -> tombol arah (kiri/kanan/atas/bawah). Satu jari per joystick; knob mengikuti jari. */
  const joys = new Map();      // pointerId -> { el, st: {l,r,u,d} }
  function joySet(j, dir, on) {
    if (j.st[dir] === on) return;
    j.st[dir] = on;
    const k = j.el.dataset[dir];
    if (on) Input.press(k); else Input.release(k);
  }
  function joyUpdate(j, x, y) {
    const r = j.el.getBoundingClientRect(), R = r.width / 2;
    let dx = x - (r.left + R), dy = y - (r.top + R);
    const m = Math.hypot(dx, dy);
    if (m > R) { dx *= R / m; dy *= R / m; }
    j.el.style.setProperty('--kx', (dx * 0.56) + 'px');
    j.el.style.setProperty('--ky', (dy * 0.56) + 'px');
    joySet(j, 'l', dx < -R * 0.28);
    joySet(j, 'r', dx > R * 0.28);
    joySet(j, 'u', dy < -R * 0.42);
    joySet(j, 'd', dy > R * 0.42);
  }
  function joyStart(e, el) {
    for (const [id, j] of Array.from(joys)) if (j.el === el) joyEnd(id);       // satu jari per joystick
    const j = { el, st: { l: false, r: false, u: false, d: false } };
    joys.set(e.pointerId, j); el.classList.add('on');
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    joyUpdate(j, e.clientX, e.clientY);
  }
  function joyEnd(id) {
    const j = joys.get(id);
    if (!j) return;
    for (const d of ['l', 'r', 'u', 'd']) joySet(j, d, false);
    j.el.classList.remove('on');
    j.el.style.setProperty('--kx', '0px'); j.el.style.setProperty('--ky', '0px');
    joys.delete(id);
  }

  const padEl = document.getElementById('pad');
  if (padEl) {
    padEl.addEventListener('pointerdown', e => {
      const jel = e.target && e.target.closest ? e.target.closest('.joy') : null;
      if (jel) { e.preventDefault(); joyStart(e, jel); return; }
      const b = e.target && e.target.closest ? e.target.closest('.tb') : null;
      if (!b) return;
      e.preventDefault();
      moveTo(e.pointerId, b);
    });
  }
  window.addEventListener('pointermove', e => {
    if (joys.has(e.pointerId)) joyUpdate(joys.get(e.pointerId), e.clientX, e.clientY);
    else if (owner.has(e.pointerId)) moveTo(e.pointerId, btnAt(e.clientX, e.clientY));
  });
  const end = e => { if (joys.has(e.pointerId)) joyEnd(e.pointerId); if (owner.has(e.pointerId)) moveTo(e.pointerId, null); };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  function releaseAll() { for (const id of Array.from(owner.keys())) moveTo(id, null); for (const id of Array.from(joys.keys())) joyEnd(id); }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); Game.onBlur(); } });

  /* Tombol utilitas: jeda, suara, layar penuh */
  const q = sel => (document.querySelector ? document.querySelector(sel) : null);
  const mute = q('#util [data-act="mute"]');
  const syncMute = () => { if (mute) mute.classList.toggle('off', SFX.status() !== 'on'); };
  const full = q('#util [data-act="full"]');
  const de = document.documentElement || {};
  if (full && !(de.requestFullscreen || de.webkitRequestFullscreen)) full.style.display = 'none';
  const util = document.getElementById('util');
  if (util) util.addEventListener('pointerdown', e => {
    const b = e.target && e.target.closest ? e.target.closest('.ub') : null;
    if (!b) return;
    e.preventDefault();
    const act = b.dataset.act;
    if (act === 'pause') { if (Online.on) { if (confirm('Keluar dari pertandingan online?')) Online.leave(); Game.net.menu(); } else Input.press('KeyP'), Input.release('KeyP'); }
    else if (act === 'mute') { SFX.toggle(); syncMute(); }
    else if (act === 'full') {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
      } catch (_) {}
    }
  });
  /* Layar penuh otomatis pada ketukan pertama (butuh gerakan pengguna) + kunci mendatar bila didukung.
     iPhone Safari tidak punya API layar penuh: gunakan "Tambah ke Layar Utama" (meta di atas membuatnya penuh). */
  let fsTries = 0;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const tryFs = () => {
    const fn = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!fn || isFs()) return;
    const lock = () => { try { if (typeof screen !== 'undefined' && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} };
    try { const r = fn.call(de, { navigationUI: 'hide' }); if (r && r.then) r.then(lock, () => {}); else lock(); } catch (_) {}
  };
  window.addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch' || fsTries >= 4 || isFs()) return;
    fsTries++; tryFs();
  }, { passive: true });
  syncMute(); if (typeof setInterval === 'function' && mute) setInterval(syncMute, 500);
  const rot = document.getElementById('rot');
  if (rot) rot.addEventListener('pointerdown', () => rot.classList.add('gone'));
})();

/* ---------------------------- LEVEL (arena bertingkat, tahap 2) ---------------------------- */
/* Lantai + 4 tingkat platform. Setiap tingkat punya celah di salah satu ujung:
     y=100 (teratas, tong muncul di sini) : celah kanan -> tong jatuh ke y=200
     y=200                                : celah kiri  -> tong jatuh ke y=300
     y=300                                : celah kanan -> tong jatuh ke y=400
     y=400                                : celah kiri  -> tong jatuh ke lantai, keluar layar di kiri
   Tiap sambungan antar-tingkat punya dua tangga. Jarak antar-tingkat (100 px) lebih besar dari
   puncak lompatan (~92 px), jadi tangga memang diperlukan. Tingkat berupa platform satu arah:
   dipijak dari atas, tetapi bisa ditembus dari bawah (tidak ada "kepala terbentur" yang
   memotong lompatan sehingga tong selalu bisa dilompati). Tidak ada jurang mematikan: pemain
   yang jatuh lewat celah mendarat di tingkat bawah, dan lantai menjangkau seluruh lebar arena. */
const TIER_H = 14;
function tier(x, w, y, rollDir) { return { x, y, w, h: TIER_H, rollDir, oneWay: true }; }
function ladder(x, top, bottom) {

const Level = {

    tier(120, CONFIG.W - 120, 400, -1),
    tier(0, CONFIG.W - 120, 300, 1),
    tier(120, CONFIG.W - 120, 200, -1),
    tier(0, CONFIG.W - 120, 100, 1)                                  // tingkat teratas (harus tetap elemen terakhir)
  ],
  ladders: [

    ladder(230, 500, 600), ladder(940, 500, 600),   // 2,3  600 -> 500
    ladder(380, 400, 500), ladder(1180, 400, 500),  // 4,5  500 -> 400
    ladder(260, 300, 400), ladder(1010, 300, 400),  // 6,7  400 -> 300
    ladder(540, 200, 300), ladder(1250, 200, 300),  // 8,9  300 -> 200
