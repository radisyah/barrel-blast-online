/* Gerbang matematika: SEMUA tangga terkunci. Di tiap sambungan kedua tangganya memakai satu status
   buka/jeda yang sama (gerbang 'alias' berbagi array open/cool dengan gerbang utamanya), jadi satu soal
   benar membuka sambungan itu dan tak ada jalan tanpa matematika. Tidak ada kebuntuan: soal boleh dicoba
   berkali-kali (jeda 3 detik bila salah). Status buka/kunci dan jeda dicatat TERPISAH per pemain
   (indeks 0 = P1, 1 = P2). Tingkat soal naik mengikuti 'junction' (0..5) ditambah kesulitan menu.
   Gerbang AKHIR (tahap 4) berdiri di tingkat teratas sebelum garis akhir. Bagi pemain yang belum
   membukanya, gerbang ini dinding setinggi arena (tidak bisa dilompati); pemain boleh mencoba soalnya
   berkali-kali (jeda 3 detik bila salah), sehingga tidak ada kondisi buntu. */
const GATE_DEFS = [
  { ladder: 1,  junction: 0, reward: 'boost'  },   // lantai -> 600        (tangga kanan)
  { ladder: 2,  junction: 1, reward: 'shield' },   // 600 -> 500          (tangga kiri)
  { ladder: 5,  junction: 2, reward: 'bonus'  },   // 500 -> 400          (tangga kanan)
  { ladder: 6,  junction: 3, reward: 'boost'  },   // 400 -> 300          (tangga kiri)
  { ladder: 9,  junction: 4, reward: 'shield' },   // 300 -> 200          (tangga kanan)
  { ladder: 10, junction: 5, reward: 'bonus'  },   // 200 -> teratas      (tangga kiri)
  { finish: true, cx: CONFIG.W - 300, y: 100, junction: 5, reward: 'bonus' }   // gerbang akhir, tingkat teratas
];
const GATE_ALIASES = [ { ladder: 0, of: 0 }, { ladder: 3, of: 1 }, { ladder: 4, of: 2 }, { ladder: 7, of: 3 }, { ladder: 8, of: 4 }, { ladder: 11, of: 5 } ];
Level.gates = GATE_DEFS.map(d => {
  if (d.finish) {
    return { ladder: null, finish: true, junction: d.junction, reward: d.reward, cx: d.cx, y: d.y,
             open: [false, false], cool: [0, 0], wall: { x: d.cx - 4, y: 0, w: 8, h: d.y } };
  }
  const L = Level.ladders[d.ladder];
  const g = { ladder: L, finish: false, junction: d.junction, reward: d.reward, cx: L.cx, y: L.bottom, open: [false, false], cool: [0, 0] };
  L.gate = g;
  return g;
});
for (const a of GATE_ALIASES) {                          // tangga pasangan: status dibagi dengan gerbang utama
  const base = Level.gates[a.of], L = Level.ladders[a.ladder];
  const g = { ladder: L, finish: false, junction: base.junction, reward: base.reward, cx: L.cx, y: L.bottom,
              open: base.open, cool: base.cool, alias: true };
  L.gate = g;
  Level.gates.push(g);
}
Level.drum = { x: 24, y: CONFIG.FLOOR };                           // drum minyak di lantai kiri: tempat api bermunculan

/* Garis akhir: zona di ujung kanan tingkat teratas. Pemain menang bila berdiri di zona ini
   (di atas platform, bukan di tangga) setelah membuka gerbang akhir. */
Level.finish = { x0: CONFIG.W - 185, x1: CONFIG.W - 134, y: 100, gate: Level.gates.find(g => g.finish) };

/* Collectible: [x, y permukaan platform, jenis]  'c' = koin berdiri, 'a' = koin udara (butuh lompat),
   'g' = gem udara (50 poin). Semua dapat dijangkau dengan berjalan atau satu lompatan penuh dari
   platform penyangganya. Posisi di atas tong/ujung kanan tingkat teratas sengaja berisiko. */
const COLLECT_DEFS = [
  [70, 700, 'c'], [200, 700, 'c'], [400, 700, 'c'], [540, 700, 'c'], [660, 700, 'c'], [870, 700, 'c'], [475, 700, 'a'],
  [250, 600, 'c'], [420, 600, 'c'], [500, 600, 'c'], [650, 600, 'c'], [880, 600, 'c'], [480, 600, 'g'],
  [60, 500, 'c'], [300, 500, 'c'], [400, 500, 'c'], [500, 500, 'c'], [650, 500, 'c'], [780, 500, 'c'], [360, 500, 'g'],
  [300, 400, 'c'], [380, 400, 'c'], [470, 400, 'c'], [560, 400, 'c'], [780, 400, 'c'], [880, 400, 'c'], [520, 400, 'g'],
  [90, 300, 'c'], [250, 300, 'c'], [330, 300, 'c'], [440, 300, 'c'], [520, 300, 'c'], [780, 300, 'c'], [400, 300, 'g'],
  [150, 200, 'c'], [430, 200, 'c'], [500, 200, 'c'], [570, 200, 'c'], [780, 200, 'c'], [880, 200, 'c'], [500, 200, 'g'],
  [330, 100, 'c'], [400, 100, 'c'], [470, 100, 'c'], [540, 100, 'c'], [740, 100, 'c']
];
const KX = CONFIG.W / 960;                               // koordinat x koleksi di atas dirancang untuk 960 px: diregangkan ke arena panjang
/* Palu: [x, y permukaan]. Pemain memegang palu 10 detik: tidak bisa lompat/memanjat, tetapi menghancurkan tong & api di depannya. */
Level.hammers = [[700, 500], [640, 400], [780, 300], [760, 200]].map(d => ({ x: d[0], y: d[1] - 14, support: d[1], active: true, respawn: 0 }));
Level.collectibles = COLLECT_DEFS.map(d => {
  const air = d[2] !== 'c', gem = d[2] === 'g';
  return { x: Math.round(d[0] * KX), y: d[1] - (air ? 62 : 20), support: d[1], air, type: gem ? 'gem' : 'coin',
           r: gem ? CONFIG.GEM_R : CONFIG.COIN_R, active: true, respawn: 0 };
});

/* ---------------------------- PLAYER ---------------------------- */
function createPlayer(index) {
  return {
    index,
    x: 0, y: 0, vx: 0, vy: 0,
    w: CONFIG.PLAYER_W, h: CONFIG.PLAYER_H,
    onGround: false,
    facing: index === 0 ? 1 : -1,
    coyote: 0,
    jumpBuf: 0,
    climbing: false, ladder: null, ladderCd: 0, climbPhase: 0,
    hitTimer: 0, invuln: 0, hits: 0, knockTier: null, throwTo: null, throwT: 0, hammer: 0, chain: 0,
    panel: null, lastQ: '',                     // panel soal aktif (milik pemain ini saja)
    boost: 0, shield: 0, slow: 0,               // efek sementara (detik tersisa)
    bonus: 0, streak: 0, comboT: 0, solved: 0, wrong: 0,   // statistik matematika (comboT = sisa detik kombo)
    score: 0, coins: 0, gems: 0, finished: false,   // skor total + collectible (skor hanya berubah lewat Score.award)
    pts: { coin: 0, gem: 0, math: 0, finish: 0, skill: 0 },   // rincian asal poin; jumlahnya selalu sama dengan score
    color: index === 0 ? '#ff4d4d' : '#4da6ff',
    accent: index === 0 ? '#ffd23f' : '#7dff7a',
    name: index === 0 ? 'P1' : 'P2'
  };
}

const players = [createPlayer(0), createPlayer(1)];

/* Pemain yang BERINTERAKSI dengan dunia (tong, api, koin, palu, gerbang, garis akhir).
   Lokal 1 perangkat & Room Master (dunia online tunggal): keduanya. Pemain online: hanya dirinya sendiri (dunia dijalankan Room Master). */
let ACT = players;
function setActors() { ACT = !Online.on || Online.master ? players : [players[Online.me]]; }

/* RNG berbenih (mulberry32): online, host mengirim satu seed sehingga SEMUA perangkat memakai rangkaian acak yang sama
   untuk dunia (tong tangga, api) dan soal matematika → gelombang & urutan soal identik, tanpa sinkronisasi jaringan. */
const Rnd = (() => {
  const mk = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  let world = Math.random;
  return {
    mk, rand: () => world(),
    seed(n) { if (!n) { this.unseed(); return; } world = mk(n ^ 0x5bd1e995); Quiz.setRng(mk(n ^ 0x1b873593)); },
    unseed() { world = Math.random; Quiz.setRng(null); }
  };
})();

function resetPlayers() {
  for (const p of players) {
    const s = Level.spawns[p.index];
    p.x = s.x; p.y = s.y;
    p.vx = 0; p.vy = 0;
    p.onGround = false;
    p.coyote = 0; p.jumpBuf = 0;
    p.climbing = false; p.ladder = null; p.ladderCd = 0; p.climbPhase = 0;
    p.hitTimer = 0; p.invuln = 0; p.hits = 0; p.knockTier = null; p.throwTo = null; p.throwT = 0;
    p.panel = null; p.lastQ = '';
    p.boost = 0; p.shield = 0; p.slow = 0;
    p.bonus = 0; p.streak = 0; p.comboT = 0; p.solved = 0; p.wrong = 0;
    p.score = 0; p.coins = 0; p.gems = 0; p.finished = false;
    p.pts.coin = 0; p.pts.gem = 0; p.pts.math = 0; p.pts.finish = 0; p.pts.skill = 0;
    p.hammer = 0; p.chain = 0;
    p.facing = p.index === 0 ? 1 : -1;
  }
}

/* ---------------------------- PHYSICS ---------------------------- */
const Physics = {
  readControls(p, stunned) {
    const k = KEYMAP[p.index];
    if (stunned) return { dir: 0, up: false, down: false, jumpHeld: false };
    return {
      dir: (Input.isDown(k.right) ? 1 : 0) - (Input.isDown(k.left) ? 1 : 0),
      up: Input.isDown(k.up),
      down: Input.isDown(k.down),
      jumpHeld: Input.isDown(k.jump)
    };
  },

  /* Hitung mundur timer efek. Dipisah dari update() agar host bisa tetap menjalankannya untuk pemain
     yang posisinya dikendalikan perangkat lain (online), tanpa menyimulasikan geraknya. */
  tick(p, dt) {
    p.ladderCd = Math.max(0, p.ladderCd - dt);
    p.hitTimer = Math.max(0, p.hitTimer - dt);
    p.throwT = Math.max(0, p.throwT - dt);
    p.hammer = Math.max(0, p.hammer - dt);
    p.invuln = Math.max(0, p.invuln - dt);
    p.boost = Math.max(0, p.boost - dt);
    p.shield = Math.max(0, p.shield - dt);
    p.slow = Math.max(0, p.slow - dt);
  },

  update(p, dt) {
    const k = KEYMAP[p.index];
    this.tick(p, dt);
    const spd = (p.boost > 0 ? CONFIG.BOOST_MULT : 1) * (p.slow > 0 ? CONFIG.SLOW_MULT : 1);
    const stunned = p.hitTimer > 0;
    const frozen = stunned || p.panel !== null;      // sedang terpental atau sedang menjawab soal
    const c = this.readControls(p, frozen);

    // Sedang di tangga: gerak vertikal sendiri, tanpa gravitasi/collision platform
    if (p.climbing) { this.updateClimb(p, c, dt); return; }

    // Lompat: buffer menangkap tekan tepat sebelum mendarat
    if (frozen || p.hammer > 0) p.jumpBuf = 0;                   // memegang palu: tidak bisa lompat
    else if (Input.latched(k.jump)) p.jumpBuf = CONFIG.JUMP_BUFFER;
    else p.jumpBuf = Math.max(0, p.jumpBuf - dt);

    p.coyote = p.onGround ? CONFIG.COYOTE : Math.max(0, p.coyote - dt);

    // Gerak horizontal dengan akselerasi terkontrol
    const ctrl = p.onGround ? 1 : CONFIG.AIR_CONTROL;
    if (c.dir !== 0) {
      p.vx += c.dir * CONFIG.MOVE_ACCEL * ctrl * spd * dt;
      p.facing = c.dir;
    } else if (p.onGround) {
      const f = CONFIG.MOVE_FRICTION * dt;
      if (Math.abs(p.vx) <= f) p.vx = 0; else p.vx -= Math.sign(p.vx) * f;
    }
    // Batas kecepatan hanya saat dikontrol; dorongan terkena tong boleh lebih cepat sesaat
    if (!stunned) p.vx = Math.max(-CONFIG.MAX_SPEED * spd, Math.min(CONFIG.MAX_SPEED * spd, p.vx));

    // Eksekusi lompat
    if (p.jumpBuf > 0 && p.coyote > 0) {
      p.vy = -CONFIG.JUMP_V;
      p.onGround = false;
      p.coyote = 0; p.jumpBuf = 0;
      FX.event('jump', p.x + p.w / 2, p.y + p.h);
    }
    // Lompat variabel: lepas tombol = lompatan lebih pendek (tidak berlaku saat terpental)
    if (!stunned && !c.jumpHeld && p.vy < -CONFIG.JUMP_V * 0.45) p.vy = -CONFIG.JUMP_V * 0.45;

    // Gravitasi
    p.vy = Math.min(p.vy + CONFIG.GRAVITY * dt, CONFIG.MAX_FALL);

    // Gerak per-sumbu + collision AABB
    p.x += (p.vx + (p.panel ? 0 : Tilt.slide() * (p.hammer > 0 ? 0.5 : 1))) * dt;   // arena miring: ikut meluncur ke sisi rendah
    this.resolveX(p);
    if (p.throwTo) {                                              // dilempar ke tingkat bawah: mendarat di dalam bentang tingkat itu
      const T = p.throwTo, lo = T.x, hi = T.x + T.w - p.w;
      if (p.x < lo) { p.x = lo; p.vx = 0; } else if (p.x > hi) { p.x = hi; p.vx = 0; }
    }
    if (p.knockTier) {                                            // terpental: jangan sampai terlempar dari ujung tingkat
      if (p.hitTimer > 0) {
        const T = p.knockTier, lo = T.x, hi = T.x + T.w - p.w;
        if (p.x < lo) { p.x = lo; p.vx = 0; } else if (p.x > hi) { p.x = hi; p.vx = 0; }
      } else p.knockTier = null;
    }
    const prevBottom = p.y + p.h, wasGround = p.onGround, vyBefore = p.vy;
    p.y += p.vy * dt;
    p.onGround = false;
    this.resolveY(p, prevBottom);
    if (p.onGround) p.chain = 0;                                  // rantai lompati-tong berakhir saat mendarat
    if (p.throwTo && (p.onGround || p.throwT <= 0 || p.y + p.h > p.throwTo.y + 30)) p.throwTo = null;   // sudah mendarat (atau pengaman waktu)
    if (p.onGround && !wasGround && vyBefore > 280) FX.event('land', p.x + p.w / 2, p.y + p.h);

    // Batas arena
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > CONFIG.W) { p.x = CONFIG.W - p.w; p.vx = 0; }
    if (p.y < 0) { p.y = 0; if (p.vy < 0) p.vy = 0; }

    // Pengaman: tidak boleh terjebak di dalam platform atau jatuh keluar arena
    if (this.touchesSolid(p)) this.unstick(p);
    if (p.y > CONFIG.H + 60) this.respawn(p);
    else this.tryGrabLadder(p, c);
  },

  /* ----- Tangga ----- */
  tryGrabLadder(p, c) {
    if (p.ladderCd > 0 || p.hitTimer > 0 || p.panel || p.hammer > 0 || (!c.up && !c.down)) return;
    const cx = p.x + p.w / 2, feet = p.y + p.h;
    for (const L of Level.ladders) {
      if (Math.abs(cx - L.cx) > CONFIG.LADDER_GRAB) continue;
      if (L.gate && !L.gate.open[p.index]) continue;      // tangga terkunci untuk pemain ini
      // Naik: kaki berada di antara dasar dan puncak. Turun: kaki di puncak atau di sepanjang tangga.
      const canUp = c.up && feet <= L.bottom + 2 && feet > L.top + 4;
      const canDown = c.down && !c.up && feet >= L.top - 2 && feet < L.bottom - 4;
      if (canUp || canDown) {
        p.climbing = true; p.ladder = L;
        p.x = L.cx - p.w / 2;
        p.vx = 0; p.vy = 0;
        p.onGround = false; p.jumpBuf = 0; p.coyote = 0;
        return;
      }
    }
  },

  updateClimb(p, c, dt) {
    const L = p.ladder;
    const v = (c.down ? 1 : 0) - (c.up ? 1 : 0);
    p.y += v * CONFIG.CLIMB_SPEED * dt;
    const prevPhase = p.climbPhase;
    p.climbPhase += Math.abs(v) * CONFIG.CLIMB_SPEED * dt;
    if (Math.floor(p.climbPhase / 16) !== Math.floor(prevPhase / 16)) SFX.play('climb');
    const feet = p.y + p.h;
    if (feet <= L.top) { this.leaveLadder(p, L.top - p.h); return; }       // sampai atas: berdiri di platform
    if (feet >= L.bottom) { this.leaveLadder(p, L.bottom - p.h); return; } // sampai bawah: berdiri di platform bawah
    // Lompat lepas dari tangga
    if (p.hitTimer <= 0 && Input.latched(KEYMAP[p.index].jump)) {
      p.climbing = false; p.ladder = null; p.ladderCd = 0.3;
      p.vy = -CONFIG.JUMP_V * CONFIG.LADDER_JUMP;
      FX.event('jump', p.x + p.w / 2, p.y + p.h);
      p.vx = c.dir * CONFIG.MAX_SPEED * CONFIG.LADDER_JUMP;
      if (c.dir) p.facing = c.dir;
    }
  },

  leaveLadder(p, y) {
    p.y = y; p.vx = 0; p.vy = 0;
    p.climbing = false; p.ladder = null;
    p.onGround = true; p.ladderCd = 0.15;
  },

  /* ----- Terkena rintangan ----- */
  hitPlayer(p, b) {
    if (p.invuln > 0) return;                                     // kebal sesaat; pemain yang sedang menjawab soal tetap bisa terkena
    if (p.panel) Gates.interrupt(p);                              // panel soal ditutup paksa, lalu pemain tetap dilempar ke tingkat bawah
    Online.cur = p.index;                                         // Room Master: efek 'hit' ini milik pemain p
    p.hits++;
    p.streak = 0; p.comboT = 0;                                   // terkena rintangan memecah kombo
    FX.event('hit', p.x + p.w / 2, p.y + p.h / 2);
    p.hitTimer = CONFIG.HIT_STUN;
    p.invuln = CONFIG.INVULN;
    p.jumpBuf = 0;
    p.knockTier = null; p.throwTo = null; p.hammer = 0;           // palu terlepas saat terkena
    // Terkena tong/api: pemain LANGSUNG dilempar ke tingkat di bawahnya (di tangga: jatuh ke dasar tangga).
    let T = null;
    if (p.climbing && p.ladder) {
      for (const s of Level.solids) if (s.y === p.ladder.bottom) { T = s; break; }
      p.climbing = false; p.ladder = null; p.ladderCd = 0.6;
    } else {
      T = this.tierBelow(p);
    }
    const away = ((p.x + p.w / 2) >= b.x ? 1 : -1);
    if (T) {
      p.throwTo = T; p.throwT = 1.5;
      p.vx = away * CONFIG.KNOCK_X * 0.8;
      p.vy = -CONFIG.KNOCK_Y * 0.6;                               // lemparan kecil ke atas lalu jatuh ke tingkat bawah
      p.onGround = false;
    } else if (p.onGround) {                                      // sudah di lantai dasar: terpental kecil saja
      for (const s of Level.solids) {
        if (Math.abs(p.y + p.h - s.y) < 2 && p.x + p.w > s.x && p.x < s.x + s.w) { p.knockTier = s; break; }
      }
      p.vx = away * CONFIG.KNOCK_X;
      p.vy = -CONFIG.KNOCK_Y;
      p.onGround = false;
    }
    Online.cur = -1;
    if (Online.on && Online.master) Online.sendHit(p);            // pemain menerapkan lemparan ini seketika di perangkatnya
  },

  /* Tingkat tepat di bawah tingkat yang sedang dipijak (atau akan dipijak bila sedang melayang). */
  tierBelow(p) {
    const cx = p.x + p.w / 2, feet = p.y + p.h;
    let cur = null, next = null;
    for (const s of Level.solids) {
      if (s.y < feet - 2 || cx < s.x - 4 || cx > s.x + s.w + 4) continue;
      if (!cur || s.y < cur.y) cur = s;
    }
    if (!cur) return null;
    for (const s of Level.solids) if (s.y > cur.y + 2 && (!next || s.y < next.y)) next = s;
    return next;
  },

  respawn(p) {
    const s = Level.spawns[p.index];
    p.x = s.x; p.y = s.y; p.vx = 0; p.vy = 0;
    p.climbing = false; p.ladder = null; p.onGround = false;
    p.invuln = CONFIG.INVULN;
  },

  /* ----- Collision ----- */
  overlap(p, s) {
    return p.x < s.x + s.w && p.x + p.w > s.x && p.y < s.y + s.h && p.y + p.h > s.y;
  },

  touchesSolid(p) {                       // hanya solid padat (platform satu arah bisa ditembus)
    for (const s of Level.solids) if (!s.oneWay && this.overlap(p, s)) return s;
    return null;
  },

  unstick(p) {
    const s = this.touchesSolid(p);
    if (!s) return;
    p.y = s.y - p.h; p.vy = 0; p.onGround = true;
  },

  resolveX(p) {
    for (const s of Level.solids) {
      if (s.oneWay || !this.overlap(p, s)) continue;
      if (p.vx > 0) p.x = s.x - p.w;
      else if (p.vx < 0) p.x = s.x + s.w;
      p.vx = 0;
    }
    // Gerbang akhir yang belum dibuka (per pemain) = dinding setinggi arena
    for (const g of Level.gates) {
      if (!g.finish || g.open[p.index] || !this.overlap(p, g.wall)) continue;
      if (p.vx < 0) p.x = g.wall.x + g.wall.w; else p.x = g.wall.x - p.w;
      p.vx = 0;
    }
  },

  resolveY(p, prevBottom) {
    for (const s of Level.solids) {
      if (!this.overlap(p, s)) continue;
      if (p.throwTo && s !== p.throwTo && s.y < p.throwTo.y) continue;   // sedang dilempar: tembus tingkat di atas target
      if (s.oneWay) {                     // mendarat hanya bila kaki sebelumnya berada di atas permukaan
        if (p.vy >= 0 && prevBottom <= s.y + 0.5) { p.y = s.y - p.h; p.onGround = true; p.vy = 0; }
        continue;
      }
      if (p.vy > 0) { p.y = s.y - p.h; p.onGround = true; }
      else if (p.vy < 0) { p.y = s.y + s.h; }
      p.vy = 0;
    }
  }
};

/* ---------------------------- BARRELS ---------------------------- */
/* Tong dikelola lewat object pool tetap: tidak ada alokasi objek baru saat game berjalan.
   Posisi (x, y) adalah titik tengah tong. Tong mendarat hanya dari atas (platform satu arah),
   dan arah gulirnya ditentukan oleh platform yang dipijaknya (rollDir). */
const Barrels = (() => {
  const pool = [];
  for (let i = 0; i < CONFIG.BARREL_POOL; i++) {
    pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, dir: 1, angle: 0, grounded: false, kind: 'normal', onLadder: null, cd: 0, descents: 0, rolled: null, jmp: [false, false] });
  }
  let spawnTimer = 0, spawnedCount = 0;
  const FAST_MULT = 1.5, LADDER_SPEED = 130;

  function reset() {
    for (const b of pool) { b.active = false; b.onLadder = null; }
    spawnTimer = 1.2;
  }

  /* kind: 'normal' | 'fast' (1.5x lebih cepat) | 'ladder' (menuruni tangga yang dilewatinya, maks 2 kali) */
  function spawn(kind) {
    for (const b of pool) {
      if (b.active) continue;
      b.active = true;
      b.x = Level.barrelSpawn.x; b.y = Level.barrelSpawn.y;
      b.vx = 0; b.vy = 0; b.dir = 1; b.angle = 0; b.grounded = true;
      b.kind = kind || 'normal'; b.onLadder = null; b.cd = 0.3; b.descents = 0; b.rolled = null; b.jmp[0] = b.jmp[1] = false;
      spawnedCount++;
      if (b.kind !== 'normal') { SFX.play('throw'); Online.emit('throw', 0, 0); }
      return true;
    }
    return false;                                    // pool penuh
  }

  function spawnBlocked() {                          // jangan memunculkan tong tepat di atas pemain
    const sx = Level.barrelSpawn.x, feet = Level.barrelSpawn.y + CONFIG.BARREL_R;
    for (const p of ACT) {
      if (Math.abs(p.x + p.w / 2 - sx) < 30 && Math.abs(p.y + p.h - feet) < 20) return true;
    }
    return false;
  }

  function hitsPlayer(b, p) {
    const px = p.x + 3, py = p.y + 2, pw = p.w - 6, ph = p.h - 4;   // kotak pemain sedikit diperkecil
    const cx = Math.max(px, Math.min(b.x, px + pw));
    const cy = Math.max(py, Math.min(b.y, py + ph));
    const dx = b.x - cx, dy = b.y - cy, r = CONFIG.BARREL_R - 2;
    return dx * dx + dy * dy < r * r;
  }

  function update(dt) {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && !spawnBlocked()) {
      spawnTimer = spawn() ? BARREL_INTERVAL[settings.difficulty] * Math.max(0.6, 1 - 0.06 * Boss.S.rages) * (Tension.finale ? 0.75 : 1) : 0.25;
    }

    const speed = BARREL_SPEED[settings.difficulty] * (1 + Math.min(0.2, 0.03 * Boss.S.rages)) * (Tension.finale ? 1.1 : 1);
    const R = CONFIG.BARREL_R;
    for (const b of pool) {
      if (!b.active) continue;
      if (b.cd > 0) b.cd -= dt;
      const LD = b.onLadder;
      if (LD) {                                      // sedang meluncur turun di tangga (tanpa tabrakan platform)
        b.x = LD.cx; b.y += LADDER_SPEED * dt; b.vx = 0; b.vy = 0; b.grounded = false;
        b.angle += 6 * dt;
        if (b.y + R >= LD.bottom) {
          b.y = LD.bottom - R; b.onLadder = null; b.grounded = true; b.cd = 0.6; b.descents++;
          for (const s of Level.solids) if (s.y === LD.bottom && b.x >= s.x && b.x <= s.x + s.w) { b.dir = s.rollDir; break; }
        }
      } else {
        const prevBottom = b.y + R;
        if (b.grounded && Math.abs(Tilt.angle()) > 0.01) b.dir = Tilt.angle() > 0 ? 1 : -1;   // arena miring: tong menggelinding ke sisi yang lebih rendah
        b.vx = b.dir * speed * (b.kind === 'fast' ? FAST_MULT : 1) * (b.grounded ? Tilt.barrelMult(b.dir) : CONFIG.BARREL_AIR_DRIFT);
        b.vy = Math.min(b.vy + CONFIG.GRAVITY * CONFIG.BARREL_GRAVITY * dt, CONFIG.MAX_FALL);
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.grounded = false;

        // Mendarat di platform bila titik tengah tong masih di atasnya dan tong datang dari atas
        for (const s of Level.solids) {
          if (b.x < s.x || b.x > s.x + s.w) continue;
          if (prevBottom <= s.y + 1 && b.y + R >= s.y) {
            b.y = s.y - R; b.vy = 0; b.grounded = true; b.dir = Math.abs(Tilt.angle()) > 0.01 ? (Tilt.angle() > 0 ? 1 : -1) : s.rollDir;
            break;
          }
        }
        b.angle += (b.vx / R) * dt;                  // putaran sesuai jarak tempuh
        if (b.grounded && b.cd <= 0) {                // di puncak tangga: tong tangga selalu turun; tong biasa kadang ikut turun
          const feet = b.y + R;
          for (const L of Level.ladders) {
            if (L.top !== feet || Math.abs(b.x - L.cx) > 3) continue;
            if (b.kind === 'ladder') { if (b.descents < 2) { b.onLadder = L; b.x = L.cx; } }
            else if (b.rolled !== L) {
              b.rolled = L;
              if (Rnd.rand() < LADDER_CHANCE[settings.difficulty] && b.descents < 3) { b.onLadder = L; b.x = L.cx; }
            }
            break;
          }
        }
      }

      if (b.x < -30 || b.x > CONFIG.W + 30 || b.y > CONFIG.H + 40) { b.active = false; continue; }

      for (const p of ACT) {                         // palu menghancurkan tong di depan pemain
        if (Hammers.inZone(p, b.x, b.y, R)) {
          Hammers.smash(p, CONFIG.SMASH_BARREL, b.x, b.y); FX.event('barrelBreak', b.x, b.y); b.active = false; break;
        }
      }
      if (!b.active) continue;
      for (const p of ACT) {                         // melompati tong = poin (rantai 100 / 300 / 800)
        if (p.onGround || p.climbing || b.onLadder || !b.grounded || b.jmp[p.index]) continue;
        const cx = p.x + p.w / 2, feet = p.y + p.h, surf = b.y + R;
        if (Math.abs(b.x - cx) < 14 && feet < surf - 18 && feet > surf - 120) {
          b.jmp[p.index] = true;
          const pts = CONFIG.JUMP_OVER[Math.min(p.chain, CONFIG.JUMP_OVER.length - 1)];
          p.chain++;
          Score.award(p, pts, 'skill', cx, feet - 12);
        }
      }
      for (const p of ACT) {
        // Tong yang sedang menggelinding hanya mengenai pemain di tingkat yang sama (kepala yang menembus platform dari bawah tidak dihitung)
        if (!b.onLadder && b.grounded && p.y + p.h > b.y + R + 6) continue;
        if (p.invuln <= 0 && hitsPlayer(b, p)) {
          if (p.shield > 0) { FX.event('shieldBlock', b.x, b.y); FX.event('barrelBreak', b.x, b.y); b.active = false; break; }   // perisai menghancurkan tong tanpa luka
          FX.event('barrelBreak', b.x, b.y);
          Physics.hitPlayer(p, b);
          b.active = false;                          // tong pecah saat mengenai pemain
          break;
        }
      }
    }
  }

  return { pool, reset, update, spawn, spawned: () => spawnedCount, timer: () => spawnTimer, setTimer: v => { spawnTimer = v; } };
})();

/* ---------------------------- BOSS & API (rintangan ala Donkey Kong) ---------------------------- */
/* Status ketegangan global: BABAK AKHIR (20 detik terakhir) membuat boss lebih ganas, tong lebih cepat, arena lebih miring, koin x2. */
const Tension = { finale: false };

/* Boss gorila berdiri di ujung kiri tingkat teratas dan melempar tong. Selain lemparan biasa:
     - AMUK: tiap beberapa detik ia menggebuk dada (peringatan 1,4 detik) lalu melempar rentetan tong
       cepat dan tong TANGGA (yang menuruni tangga, ancaman bagi pemain yang sedang memanjat);
     - HUKUMAN: setiap jawaban salah / waktu soal habis membuat boss melempar satu tong tangga (antrean maks 2).
   Tong yang menggelinding sampai drum minyak di lantai kiri menyulut API: api berpatroli di platform
   dan memanjat tangga menuju pemain terdekat yang berada di tingkat lain. Perisai (hadiah gerbang soal)
   menghancurkan tong maupun api tanpa luka. Semuanya memakai pool tetap dan dt tetap (bebas FPS). */
const Boss = (() => {
  const TELEGRAPH = 1.4, VOLLEY_GAP = 0.6, PUNISH_CD = 1.2, MAX_PUNISH = 2;
  const S = { phase: 0, phT: 0, rageT: 0, throwT: 0, rages: 0, pending: 0 };   // phase 0 diam, 1 gebuk dada, 2 rentetan
  let vi = 0, volT = 0, punishCd = 0, lastSpawned = 0;

  function reset() {
    S.phase = 0; S.phT = 0; S.rageT = RAGE_FIRST[settings.difficulty]; S.throwT = 0; S.rages = 0; S.pending = 0;
    vi = 0; volT = 0; punishCd = 0; lastSpawned = Barrels.spawned();
  }
  function punish() { if (S.pending < MAX_PUNISH) S.pending++; }

  function update(dt) {
    const sp = Barrels.spawned();
    if (sp !== lastSpawned) { lastSpawned = sp; S.throwT = 0.45; }          // animasi lempar untuk setiap tong baru
    if (S.throwT > 0) S.throwT -= dt;
    if (punishCd > 0) punishCd -= dt;
    if (S.phase === 0) {
      if (Tension.finale && S.rageT > 7) S.rageT = 7;                      // babak akhir: amukan segera datang
      S.rageT -= dt;
      if (S.rageT <= 0) { S.phase = 1; S.phT = TELEGRAPH; S.rages++; FX.event('roar', 40, 80); }
      else if (S.pending > 0 && punishCd <= 0) {
        if (Barrels.spawn('ladder')) { S.pending--; punishCd = PUNISH_CD; } else punishCd = 0.3;
      }
    } else if (S.phase === 1) {
      S.phT -= dt;
      if (S.phT <= 0) { S.phase = 2; vi = 0; volT = 0; }
    } else {
      volT -= dt;
      if (volT <= 0) {
        const v = RAGE_VOLLEY[settings.difficulty], extra = Math.min(3, Math.floor(S.rages / 2));   // tiap 2 amukan: +1 tong (maks +3)
        if (vi < v.length + extra) { Barrels.spawn(v[vi % v.length]); vi++; volT = VOLLEY_GAP * (Tension.finale ? 0.75 : 1); }
        else { S.phase = 0; S.rageT = RAGE_EVERY[settings.difficulty] * Math.max(0.55, 1 - 0.08 * S.rages) * (Tension.finale ? 0.7 : 1); }
      }
    }
  }
  return { reset, update, punish, S };
})();


/* ---------------------------- TILT: boss gorila memiringkan arena (ala Donkey Kong) ---------------------------- */
/* Saat boss menggebuk dada (fase 1) arena mulai bergoyang lalu miring ke satu sisi; miring bertahan
   selama rentetan tong (fase 2) dan pulih pelan setelahnya. Arah berganti tiap amukan.
   Efek tampilan: seluruh dunia permainan diputar (kamera roll), HUD & kontrol sentuh tetap tegak.
   Efek permainan (fisika tetap rata, hanya ditambah gaya "turun lereng"):
     - pemain yang berdiri di platform meluncur ke sisi yang lebih rendah (SLIDE px/detik pada miring maksimum);
     - tong menggelinding lebih cepat ke arah turunan dan lebih lambat ke arah tanjakan. */
const Tilt = (() => {
  const MAX = [0.04, 0.055, 0.07];          // radian per kesulitan (~2,3° / 3,2° / 4°)
  const SLIDE = 90;                          // px/detik pada sudut maksimum tersulit
  const S = { a: 0, dir: 1, prev: 0, tick: 0, wob: 0 };
  function reset() { S.a = 0; S.dir = 1; S.prev = 0; S.tick = 0; S.wob = 0; }
  function update(dt, phase) {
    const mx = MAX[settings.difficulty] * (Tension.finale ? 1.25 : 1);
    if (phase !== S.prev) { if (phase === 1) { S.dir = -S.dir; S.tick = 0; } S.prev = phase; }
    let target = 0, rate = 0.9;                                     // fase 0: pulih pelan
    if (phase === 1) {
      target = S.dir * mx; rate = 1.1;
      S.tick -= dt;
      if (S.tick <= 0) {                                            // tiap gebukan: guncangan + debu berjatuhan dari atas
        S.tick = 0.35; FX.shake(0.22, 3);
        for (let i = 0; i < 5; i++) FX.spawn(Math.random() * CONFIG.W, 8, (Math.random() - 0.5) * 30, 20, 500, 0.9, 2, i % 2 ? '#8a8fa8' : '#cfc9d8');
      }
    } else if (phase === 2) { target = S.dir * mx; rate = 3; }
    S.wob += dt;
    S.a += (target - S.a) * Math.min(1, rate * dt);
    if (target === 0 && Math.abs(S.a) < 0.0004) S.a = 0;
  }
  const angle = () => S.a;
  const visual = phase => S.a + (phase === 1 ? Math.sin(S.wob * 45) * 0.004 : 0);   // getar halus saat peringatan
  const slide = () => Math.sin(S.a) * (SLIDE / Math.sin(MAX[2])) * 1.0;          // + = meluncur ke kanan
  const barrelMult = dir => Math.max(0.55, Math.min(1.45, 1 + dir * Math.sin(S.a) * 5));
  return { reset, update, angle, visual, slide, barrelMult, S };
})();

const Flames = (() => {
  const N = 4, W = 16, H = 22, CLIMB = 34, LIFE = 26, DRUM_CD = 5;
  const pool = [];
  for (let i = 0; i < N; i++) pool.push({ active: false, x: 0, y: 0, dir: 1, climb: null, cd: 0, life: 0 });
  let spawnT = 0, drumCd = 0;
  const alive = () => { let n = 0; for (const f of pool) if (f.active) n++; return n; };

  function reset() {
    for (const f of pool) { f.active = false; f.climb = null; }
    spawnT = FLAME_FIRST[settings.difficulty]; drumCd = 0;
  }
  function spawn() {
    for (const f of pool) {
      if (f.active) continue;
      f.active = true; f.x = Level.drum.x + 22; f.y = Level.drum.y; f.dir = 1; f.climb = null; f.cd = 1.0; f.life = LIFE;
      FX.event('ignite', f.x, f.y - 14);
      return true;
    }
    return false;
  }
  function target(f) {                               // pemain terdekat
    let best = null, bd = Infinity;
    for (const p of ACT) {
      const dx = p.x + p.w / 2 - f.x, dy = p.y + p.h - f.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }
  function hits(f, p) {
    return p.x + 3 < f.x + W / 2 && p.x + p.w - 3 > f.x - W / 2 && p.y + 2 < f.y && p.y + p.h - 2 > f.y - H;
  }

  function update(dt) {
    const R = CONFIG.BARREL_R, df = settings.difficulty;
    drumCd -= dt; spawnT -= dt;
    for (const b of Barrels.pool) {                  // tong yang sampai di drum menyulut api
      if (!b.active || b.onLadder || !b.grounded) continue;
      if (Math.abs(b.y + R - Level.drum.y) < 1 && b.x < Level.drum.x + 8) {
        b.active = false;
        FX.event('ignite', b.x, b.y);
        if (drumCd <= 0 && alive() < FLAME_MAX[df]) { spawn(); drumCd = DRUM_CD; spawnT = FLAME_EVERY[df]; }
      }
    }
    if (spawnT <= 0) { spawnT = FLAME_EVERY[df]; if (alive() < FLAME_MAX[df]) spawn(); }

    for (const f of pool) {
      if (!f.active) continue;
      f.life -= dt;
      if (f.life <= 0) { f.active = false; FX.event('flameOut', f.x, f.y - 10); continue; }
      if (f.cd > 0) f.cd -= dt;
      const tp = target(f), tfeet = tp ? tp.y + tp.h : f.y;
      if (f.climb) {
        const L = f.climb.L, d = f.climb.dir;
        f.x = L.cx; f.y += d * CLIMB * dt;
        if (d < 0 && f.y <= L.top) { f.y = L.top; f.climb = null; f.cd = 1.5; }
        else if (d > 0 && f.y >= L.bottom) { f.y = L.bottom; f.climb = null; f.cd = 1.5; }
        if (!f.climb && tp) f.dir = (tp.x + tp.w / 2) >= f.x ? 1 : -1;
      } else {
        let lo = 12, hi = CONFIG.W - 12;
        for (const s of Level.solids) if (s.y === f.y) { lo = s.x + 12; hi = s.x + s.w - 12; break; }
        f.x += f.dir * FLAME_SPEED[df] * dt;
        if (f.x <= lo) { f.x = lo; f.dir = 1; } else if (f.x >= hi) { f.x = hi; f.dir = -1; }
        if (Rnd.rand() < dt * 0.35) f.dir = (tp && Rnd.rand() < 0.65) ? ((tp.x + tp.w / 2) >= f.x ? 1 : -1) : -f.dir;
        if (f.cd <= 0 && tp) {                       // pilih memanjat bila pemain terdekat berada di tingkat lain
          for (const L of Level.ladders) {
            if (Math.abs(f.x - L.cx) > 3) continue;
            const up = f.y === L.bottom && tfeet < f.y - 40, down = f.y === L.top && tfeet > f.y + 40;
            if (!up && !down) continue;
            if (Rnd.rand() < 0.65) f.climb = { L, dir: up ? -1 : 1 }; else f.cd = 1.2;
            break;
          }
        }
      }
      for (const p of ACT) {
        if (Hammers.inZone(p, f.x, f.y - 10, 10)) { Hammers.smash(p, CONFIG.SMASH_FLAME, f.x, f.y - 10); FX.event('flameOut', f.x, f.y - 10); f.active = false; break; }
      }
      if (!f.active) continue;
      for (const p of ACT) {
        if (!f.climb && p.y + p.h > f.y + 6) continue;   // api hanya mengenai pemain di tingkat yang sama
        if (p.invuln > 0 || !hits(f, p)) continue;
        if (p.shield > 0) { FX.event('shieldBlock', f.x, f.y - 10); FX.event('flameOut', f.x, f.y - 10); f.active = false; break; }
        Physics.hitPlayer(p, f);
      }
    }
  }
  return { pool, reset, update, spawn, alive, W, H };
})();

/* ---------------------------- QUIZ ---------------------------- */
/* Generator soal. Setiap soal: teks, 4 pilihan unik (string), tepat satu jawaban benar.
   Tingkat (tier) 1..5 menambah topik yang tersedia dan memperbesar rentang angka:
     tier 1: penjumlahan/pengurangan, perkalian/pembagian dasar
     tier 2: + operasi campuran, bilangan negatif, pola bilangan, persamaan sederhana
     tier 3: + desimal, pecahan, persentase
     tier 4-5: angka lebih besar, bentuk soal lebih sulit
   RNG dapat diganti (Quiz.setRng) agar dapat diuji secara deterministik. */
const Quiz = (() => {
  let rng = Math.random;
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));            // bilangan bulat acak [a, b]
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
  const paren = n => (n < 0 ? '(' + n + ')' : String(n));

  /* Tiga pengecoh bilangan bulat: utamakan kesalahan umum (extras), lalu isi dengan angka di sekitar jawaban. */
  function distinctInts(ans, extras, allowNeg) {
    const out = [];
    const add = v => {
      if (out.length >= 3 || !Number.isInteger(v) || v === ans || out.indexOf(v) >= 0) return;
      if (!allowNeg && ans >= 0 && v < 0) return;
      out.push(v);
    };
    shuffle(extras.slice()).forEach(add);
    shuffle([1, -1, 2, -2, 3, -3, 10, -10]).forEach(o => add(ans + o));
    for (let k = 4; out.length < 3; k++) { add(ans + k); add(ans - k); }
    return out;
  }

  function build(text, answer, wrong, extra) {
    const opts = shuffle([answer].concat(wrong));
    return Object.assign({ text, options: opts, correct: opts.indexOf(answer), answer }, extra);
  }
  const buildInt = (text, ans, extras, extra, allowNeg) =>
    build(text, String(ans), distinctInts(ans, extras, allowNeg).map(String), extra);

  /* --- penjumlahan & pengurangan --- */
  function genAddSub(t) {
    const hi = [20, 99, 500, 999, 999][t - 1], lo = [1, 10, 50, 100, 100][t - 1];
    let a = ri(lo, hi), b = ri(lo, hi);
    const add = rng() < 0.5;
    if (!add && b > a) { const x = a; a = b; b = x; }
    const ans = add ? a + b : a - b;
    const expr = a + (add ? ' + ' : ' - ') + b;
    const extras = add ? [ans + 10, ans - 10, ans + 1, ans - 1] : [a + b, b - a, ans + 10, ans - 10, ans + 1];
    return buildInt(expr + ' = ?', ans, extras, { kind: 'expr', expr });
  }

  /* --- perkalian & pembagian (pembagian selalu habis) --- */
  function genMulDiv(t) {
    const r = [[2, 5, 2, 10], [2, 10, 2, 10], [11, 20, 2, 9], [12, 99, 3, 9], [12, 30, 11, 25]][t - 1];
    const a = ri(r[0], r[1]), b = ri(r[2], r[3]);
    if (rng() < 0.6) {
      const ans = a * b, expr = a + ' × ' + b;
      return buildInt(expr + ' = ?', ans, [ans + a, ans - a, ans + b, ans - b, ans + 10, ans - 10], { kind: 'expr', expr });
    }
    const dividend = a * b, expr = dividend + ' ÷ ' + b;
    return buildInt(expr + ' = ?', a, [a + 1, a - 1, a + 2, a - 2, b, dividend - b], { kind: 'expr', expr });
  }

  /* --- operasi campuran (urutan operasi) --- */
  function genMixed(t) {
    const T = {
      2: [() => {
        const a = ri(5, 30), b = ri(5, 30), c = ri(1, Math.min(a + b, 20)), ans = a + b - c;
        return { expr: a + ' + ' + b + ' - ' + c, ans, wrong: [a + b + c, ans + 1, ans - 1, ans + 10] };
      }],
      3: [() => {
        const a = ri(2, 30), b = ri(2, 9), c = ri(2, 9), ans = a + b * c;
        return { expr: a + ' + ' + b + ' × ' + c, ans, wrong: [(a + b) * c, a + b + c, ans + b, ans - c] };
      }, () => {
        const a = ri(3, 12), b = ri(3, 9), c = ri(2, a * b - 1), ans = a * b - c;
        return { expr: a + ' × ' + b + ' - ' + c, ans, wrong: [a * (b - c), a * b + c, ans + 1, ans - 1] };
      }, () => {
        const a = ri(30, 80), b = ri(2, 6), c = ri(2, 6), ans = a - b * c;
        return { expr: a + ' - ' + b + ' × ' + c, ans, wrong: [(a - b) * c, a - b - c, a + b * c, ans + 2] };
      }],
      4: [() => {
        const a = ri(2, 15), b = ri(2, 15), c = ri(2, 9), ans = (a + b) * c;
        return { expr: '(' + a + ' + ' + b + ') × ' + c, ans, wrong: [a + b * c, a * c + b, ans + c, ans - c] };
      }, () => {
        const a = ri(10, 40), b = ri(1, a - 1), c = ri(2, 9), ans = (a - b) * c;
        return { expr: '(' + a + ' - ' + b + ') × ' + c, ans, wrong: [a - b * c, a * c - b, ans + c, ans - c] };
      }, () => {
        const a = ri(5, 30), b = ri(2, 9), c = ri(2, 9), d = ri(1, 10), ans = a + b * c - d;
        return { expr: a + ' + ' + b + ' × ' + c + ' - ' + d, ans, wrong: [(a + b) * c - d, a + b * c + d, ans + 1, ans - 1] };
      }],
      5: [() => {
        const a = ri(2, 12), b = ri(2, 12), c = ri(2, 12), d = ri(2, 12), ans = a * b + c * d;
        return { expr: a + ' × ' + b + ' + ' + c + ' × ' + d, ans, wrong: [(a * b + c) * d, a * (b + c) * d, ans + a, ans - d] };
      }, () => {
        const a = ri(3, 20), b = ri(3, 20), c = ri(2, 9), d = ri(1, 15), ans = (a + b) * c - d;
        return { expr: '(' + a + ' + ' + b + ') × ' + c + ' - ' + d, ans, wrong: [a + b * c - d, (a + b) * (c - d), ans + d, ans - c] };
      }, () => {
        const y = ri(2, 9), x = ri(2, 12), e = x * y, c = ri(2, 9), d = ri(2, 9), ans = x + c * d;
        return { expr: e + ' ÷ ' + y + ' + ' + c + ' × ' + d, ans, wrong: [(x + c) * d, ans + y, ans - c, e + c * d] };
      }]
    };
    const g = pick(T[Math.max(2, Math.min(5, t))])();
    return buildInt(g.expr + ' = ?', g.ans, g.wrong, { kind: 'expr', expr: g.expr });
  }

  /* --- bilangan positif dan negatif --- */
  function genSigned(t) {
    const m = t <= 2 ? 9 : t <= 3 ? 15 : 25;
    const form = ri(0, t >= 3 ? 4 : 2);
    const sgn = () => (rng() < 0.5 ? -1 : 1);
    let a = ri(-m, m), b = ri(-m, m);
    if (a === 0) a = -3;
    if (b === 0) b = 4;
    let expr, ans, extras;
    if (form === 0) { expr = paren(a) + ' + ' + paren(b); ans = a + b; extras = [a - b, -(a + b), b - a, Math.abs(a) + Math.abs(b)]; }
    else if (form === 1) { expr = paren(a) + ' - ' + paren(b); ans = a - b; extras = [a + b, b - a, ans + 2, ans - 2]; }
    else if (form === 2) { a = ri(1, m); b = ri(a + 1, a + m); expr = a + ' - ' + b; ans = a - b; extras = [b - a, a + b, -(a + b), ans - 2]; }
    else if (form === 3) {
      const x = ri(2, 9) * sgn(), y = ri(2, 9) * sgn();
      expr = paren(x) + ' × ' + paren(y); ans = x * y; extras = [-ans, x + y, ans + x, ans - y];
    } else {
      const y = ri(2, 9) * sgn(), q = ri(2, 9) * sgn(), dividend = q * y;
      expr = paren(dividend) + ' ÷ ' + paren(y); ans = q; extras = [-q, q + 1, q - 1, dividend + y];
    }
    return buildInt(expr + ' = ?', ans, extras, { kind: 'expr', expr }, true);
  }

  /* --- desimal (disimpan sebagai bilangan bulat berskala agar tanpa galat floating point) --- */
  function fmtDec(v, d) {
    const S = Math.pow(10, d), a = Math.abs(v);
    return (v < 0 ? '-' : '') + Math.floor(a / S) + '.' + String(a % S).padStart(d, '0');
  }
  function genDecimal(t) {
    const d = t <= 3 ? 1 : 2, S = Math.pow(10, d);
    const op = (t >= 4 && rng() < 0.4) ? 'mul' : (rng() < 0.5 ? 'add' : 'sub');
    let expr, ans, extras;
    if (op === 'mul') {
      const x = ri(2, 9), y = ri(S + 1, 9 * S);
      ans = x * y; expr = fmtDec(y, d) + ' × ' + x;
      extras = [ans + y, ans - y, ans + S, ans - S, ans * 10];
    } else {
      let a = ri(S + 1, 20 * S), b = ri(S + 1, 20 * S);
      if (op === 'sub' && b > a) { const x = a; a = b; b = x; }
      ans = op === 'add' ? a + b : a - b;
      expr = fmtDec(a, d) + (op === 'add' ? ' + ' : ' - ') + fmtDec(b, d);
      extras = [ans + 1, ans - 1, ans + S, ans - S, ans * 10];
    }
    return build(expr + ' = ?', fmtDec(ans, d), distinctInts(ans, extras).map(v => fmtDec(v, d)), { kind: 'dec', expr, d });
  }

  /* --- pecahan --- */
  const fr = (n, d) => { const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const frStr = f => (f.d === 1 ? String(f.n) : f.n + '/' + f.d);
  function distinctFracs(ans, extras) {
    const seen = [frStr(ans)], out = [];
    const add = f => {
      if (out.length >= 3 || !f || f.n <= 0 || f.d <= 0 || !Number.isInteger(f.n) || !Number.isInteger(f.d)) return;
      const str = frStr(f);
      if (seen.indexOf(str) >= 0) return;
      seen.push(str); out.push(str);
    };
    shuffle(extras.slice()).forEach(add);
    shuffle([[1, 0], [-1, 0], [0, 1], [0, -1], [2, 0], [0, 2], [-2, 0], [1, 1], [-1, 1]])
      .forEach(p => add(fr(ans.n + p[0], ans.d + p[1])));
    for (let k = 1; out.length < 3; k++) { add(fr(ans.n + k, ans.d)); add(fr(ans.n, ans.d + k)); }
    return out;
  }
  function genFraction(t) {
    const forms = ['same', 'of'];
    if (t >= 4) forms.push('multiple');
    if (t >= 5) forms.push('diff', 'mul');
    const form = pick(forms);
    if (form === 'of') {
      const d = pick([2, 3, 4, 5, 6, 8, 10]), n = ri(1, d - 1), k = ri(2, t >= 4 ? 12 : 6), base = d * k, ans = n * k;
      return buildInt(n + '/' + d + ' dari ' + base + ' = ?', ans, [ans + k, ans - k, base - ans, ans + 1, ans - 1],
        { kind: 'fracof', n, d, base });
    }
    let n1, d1, n2, d2, op = rng() < 0.5 ? '+' : '-';
    if (form === 'same') { d1 = d2 = ri(4, 12); n1 = ri(1, d1 - 1); n2 = ri(1, d1 - 1); }
    else if (form === 'multiple') { d1 = pick([2, 3, 4, 5, 6]); d2 = d1 * ri(2, 3); n1 = ri(1, d1 - 1); n2 = ri(1, d2 - 1); }
    else if (form === 'diff') {
      d1 = pick([3, 4, 5, 6, 8]); do { d2 = pick([3, 4, 5, 6, 8]); } while (d2 === d1);
      n1 = ri(1, d1 - 1); n2 = ri(1, d2 - 1);
    } else { d1 = pick([2, 3, 4, 5, 6]); d2 = pick([2, 3, 4, 5, 6]); n1 = ri(1, d1 - 1); n2 = ri(1, d2 - 1); op = '×'; }
    if (op === '-') {                                     // hasil pengurangan harus positif
      const diff = n1 * d2 - n2 * d1;
      if (diff === 0) op = '+';
      else if (diff < 0) { let x = n1; n1 = n2; n2 = x; x = d1; d1 = d2; d2 = x; }
    }
    let f, extras;
    if (op === '+') { f = fr(n1 * d2 + n2 * d1, d1 * d2); extras = [fr(n1 + n2, d1 + d2), fr(n1 * n2, d1 * d2)]; }
    else if (op === '-') { f = fr(n1 * d2 - n2 * d1, d1 * d2); extras = [fr(Math.abs(n1 - n2), d1 + d2), fr(n1 * n2, d1 * d2)]; }
    else { f = fr(n1 * n2, d1 * d2); extras = [fr(n1 * d2 + n2 * d1, d1 * d2), fr(n1 + n2, d1 + d2)]; }
    return build(n1 + '/' + d1 + ' ' + op + ' ' + n2 + '/' + d2 + ' = ?', frStr(f), distinctFracs(f, extras),
      { kind: 'frac', n1, d1, n2, d2, op });
  }

  /* --- persentase (angka dipilih agar hasil selalu bilangan bulat) --- */
  function genPercent(t) {
    const forms = ['of'];
    if (t >= 4) forms.push('which');
    if (t >= 5) forms.push('disc');
    const form = pick(forms);
    if (form === 'of') {
      const X = pick(t <= 3 ? [10, 20, 25, 50] : [5, 10, 15, 20, 25, 30, 40, 50, 60, 75]);
      const B = 20 * ri(1, t <= 3 ? 10 : 20), ans = X * B / 100;
      return buildInt(X + '% dari ' + B + ' = ?', ans, [B - ans, ans * 2, ans + 2, ans - 2, Math.floor(B / X)],
        { kind: 'pct', form, X, B });
    }
    if (form === 'which') {
      const X = 5 * ri(1, 19), base = pick([20, 40, 60, 80, 100, 200]), part = X * base / 100;
      return build(part + ' adalah berapa % dari ' + base + ' ?', X + '%',
        distinctInts(X, [100 - X, X + 5, X - 5, X * 2, X + 10]).map(v => v + '%'), { kind: 'pct', form, X, base, part });
    }
    const B = 20 * ri(2, 20), X = pick([10, 20, 25, 30, 40, 50]), disc = X * B / 100, ans = B - disc;
    return buildInt('Harga ' + B + ', diskon ' + X + '%. Bayar = ?', ans, [disc, B + disc, B - X, ans + 5, ans - 5],
      { kind: 'pct', form: 'disc', X, B });
  }

  /* --- pola bilangan --- */
  function genPattern(t) {
    const form = pick(t >= 5 ? ['arith', 'geo', 'sq', 'dd'] : t >= 4 ? ['arith', 'geo', 'sq'] : ['arith']);
    let terms, next, extras;
    if (form === 'arith') {
      let d = ri(2, t <= 2 ? 9 : 12);
      if (t >= 3 && rng() < 0.5) d = -d;
      const a = d > 0 ? ri(1, 30) : ri(40, 80);
      terms = [0, 1, 2, 3].map(i => a + i * d); next = a + 4 * d;
      extras = [next + 1, next - 1, terms[3] + 2 * d, terms[3] - d, next + 2];
    } else if (form === 'geo') {
      const r = pick(t === 4 ? [2, 3] : [2, 3, 4]), a = ri(1, 5);
      terms = [0, 1, 2, 3].map(i => a * Math.pow(r, i)); next = a * Math.pow(r, 4);
      extras = [terms[3] + (terms[3] - terms[2]), next + a, next - a, terms[3] * (r + 1)];
    } else if (form === 'sq') {
      const k = ri(1, 6);
      terms = [0, 1, 2, 3].map(i => (k + i) * (k + i)); next = (k + 4) * (k + 4);
      extras = [terms[3] + 2 * (k + 3), next + 2, next - 2, terms[3] + (terms[3] - terms[2])];
    } else {
      const a = ri(1, 10), d0 = ri(1, 4);
      const t1 = a + d0, t2 = t1 + d0 + 1, t3 = t2 + d0 + 2;
      terms = [a, t1, t2, t3]; next = t3 + d0 + 3;
      extras = [t3 + (t3 - t2), next + 1, next - 1, t3 + d0 + 2, t3 + d0 + 4];
    }
    return buildInt('Pola: ' + terms.join(', ') + ', ?', next, extras, { kind: 'pat', terms });
  }

  /* --- persamaan sederhana --- */
  function genEquation(t) {
    const form = pick(t <= 2 ? ['add'] : t === 3 ? ['add', 'sub', 'mul'] : t === 4 ? ['mul', 'lin'] : ['lin', 'lin2']);
    let a, b, c, x, text, extras, allowNeg = false;
    if (form === 'add') {
      a = ri(1, 20); x = ri(1, 20); b = x + a;
      text = 'Jika x + ' + a + ' = ' + b + ', maka x = ?'; extras = [b + a, a - b, x + 1, x - 1, b];
    } else if (form === 'sub') {
      a = ri(1, 20); b = ri(1, 20); x = a + b;
      text = 'Jika x - ' + a + ' = ' + b + ', maka x = ?'; extras = [b - a, a - b, x + 1, x - 1, b];
    } else if (form === 'mul') {
      a = ri(2, 9); x = ri(2, 12); b = a * x;
      text = 'Jika ' + a + 'x = ' + b + ', maka x = ?'; extras = [b - a, b + a, x + 1, x - 1, a];
    } else if (form === 'lin') {
      a = ri(2, 9); x = ri(1, 12); b = ri(1, 20); c = a * x + b;
      text = 'Jika ' + a + 'x + ' + b + ' = ' + c + ', maka x = ?'; extras = [c - b, c + b, x + 1, x - 1, (c + b) / a];
    } else {
      a = ri(2, 9); x = ri(-8, 12); b = ri(1, 20); c = a * x - b; allowNeg = true;
      text = 'Jika ' + a + 'x - ' + b + ' = ' + c + ', maka x = ?'; extras = [(c - b) / a, c + b, x + 1, x - 1, -x];
    }
    return buildInt(text, x, extras, { kind: 'eq', form, a, b, c }, allowNeg);
  }

  const TOPICS = [
    { id: 'addsub',   min: 1, gen: genAddSub },
    { id: 'muldiv',   min: 1, gen: genMulDiv },
    { id: 'mixed',    min: 2, gen: genMixed }      // campuran tetap hanya + - × ÷ (tanpa negatif, desimal, pecahan, persen, pola, persamaan)
  ];

  /* Validasi struktur: 4 pilihan string unik, tepat satu sama dengan jawaban, indeks benar konsisten. */
  function validate(q) {
    if (!q || typeof q.text !== 'string' || !Array.isArray(q.options) || q.options.length !== 4) return false;
    const seen = {};
    for (const o of q.options) {
      if (typeof o !== 'string' || o === '' || o.indexOf('NaN') >= 0 || o.indexOf('undefined') >= 0 || o.indexOf('Infinity') >= 0 || seen[o]) return false;
      seen[o] = true;
    }
    return q.correct >= 0 && q.correct < 4 && q.options[q.correct] === q.answer &&
           q.options.filter(o => o === q.answer).length === 1;
  }

  function make(tier, avoidText, forcedTopic) {
    tier = Math.max(1, Math.min(5, tier | 0));
    const pool = TOPICS.filter(tp => forcedTopic ? tp.id === forcedTopic : tp.min <= tier);
    for (let i = 0; i < 40; i++) {
      const tp = pick(pool), q = tp.gen(tier);
      if (validate(q) && q.text !== avoidText) { q.tier = tier; q.topic = tp.id; return q; }
    }
    const q = genAddSub(1); q.tier = tier; q.topic = 'addsub';          // cadangan yang selalu valid
    return q;
  }

  return { make, validate, setRng: fn => { rng = fn || Math.random; }, TOPIC_IDS: TOPICS.map(tp => tp.id) };
})();

/* ---------------------------- GATES ---------------------------- */
/* Interaksi gerbang & panel soal. Setiap pemain punya panel sendiri (p.panel), kontrol sendiri
   (P1: A/D/W/S + E, P2: panah + Enter), dan status buka/jeda sendiri per gerbang.
   Saat menjawab, pemain berhenti tetapi TIDAK kebal: terkena tong/api menutup panel dan melempar pemain ke tingkat bawah. */
const REWARD_NAME = { boost: 'TURBO', shield: 'PERISAI', bonus: 'BONUS x2' };
const Gates = (() => {
  const WRONG_COOLDOWN = 3, CANCEL_COOLDOWN = 1, FB_OK = 1.0, FB_BAD = 1.6;
  const PW = 440, PH = 186;   // ukuran desain panel (digambar lalu diskalakan K)

  function reset() {
    for (const g of Level.gates) { g.open[0] = g.open[1] = false; g.cool[0] = g.cool[1] = 0; }
  }

  /* Gerbang yang dapat berinteraksi dengan pemain: berdiri di dasar tangga bergerbang. */
  function nearGate(p) {
    if (!p.onGround || p.climbing || p.hitTimer > 0) return null;
    const cx = p.x + p.w / 2, feet = p.y + p.h;
    for (const g of Level.gates) {
      if (Math.abs(cx - g.cx) <= 40 && Math.abs(feet - g.y) < 1) return g;
    }
    return null;
  }

  function tierFor(g) { return Math.min(5, 1 + g.junction + settings.difficulty); }

  function tryOpen(p) {
    if (p.panel) return false;
    const g = nearGate(p);
    if (!g || g.open[p.index] || g.cool[p.index] > 0) return false;
    const q = Quiz.make(tierFor(g), p.lastQ);
    p.lastQ = q.text;
    const T = QTIMES[settings.qtime];
    p.panel = { gate: g, q, sel: 0, chosen: -1, phase: 'ask', timeLeft: T, total: T, fbTimer: 0, fb: null };
    p.vx = 0;
    SFX.play('panelOpen');
    return true;
  }

  /* idx: pilihan 0..3, atau -1 bila waktu habis. */
  function answer(p, idx) {
    const pn = p.panel;
    if (!pn || pn.phase !== 'ask') return;
    const q = pn.q, g = pn.gate;
    pn.chosen = idx;
    Online.cur = p.index;
    if (idx === q.correct) {
      p.streak++; p.solved++; p.comboT = CONFIG.COMBO_TIME;
      const frac = Math.max(0, pn.timeLeft / pn.total);
      let pts = 50 * q.tier + Math.round(50 * frac) + 10 * Math.min(p.streak, 5);   // makin cepat & beruntun, makin besar
      if (g.reward === 'bonus') pts *= 2;
      if (g.reward === 'boost') { p.boost = CONFIG.BOOST_TIME; FX.event('boost', p.x + p.w / 2, p.y + p.h / 2); }
      if (g.reward === 'shield') { p.shield = CONFIG.SHIELD_TIME; FX.event('shield', p.x + p.w / 2, p.y + p.h / 2); }
      FX.event('gateOpen', g.cx, g.y - 20, p.accent);
      Score.award(p, pts, 'math', p.x + p.w / 2, p.y - 8);          // satu-satunya pintu skor (juga menambah p.bonus)
      g.open[p.index] = true;                                       // tangga terbuka untuk pemain ini saja
      pn.fb = { ok: true, title: 'BENAR!', detail: '+' + pts + ' ' + REWARD_NAME[g.reward] + (p.streak > 0 ? ' KOMBO x' + Score.mult(p) : '') };
      pn.fbTimer = FB_OK;
    } else {
      p.streak = 0; p.comboT = 0; p.wrong++;
      Boss.punish();                                                // jawaban salah membangunkan boss: satu tong tangga
      p.slow = CONFIG.SLOW_TIME;                                    // konsekuensi ringan: melambat sebentar
      FX.event('gateWrong', p.x + p.w / 2, p.y + p.h / 2);
      FX.event('slow', p.x + p.w / 2, p.y + p.h / 2);
      g.cool[p.index] = WRONG_COOLDOWN;                             // + harus menunggu sebelum mencoba lagi
      pn.fb = { ok: false, title: idx < 0 ? 'WAKTU HABIS!' : 'SALAH!', detail: 'Jawaban: ' + q.answer };
      pn.fbTimer = FB_BAD;
    }
    pn.phase = 'feedback';
    Online.cur = -1;
  }

  /* Terkena tong/api saat panel terbuka: panel ditutup tanpa penalti jawaban (jeda singkat bila belum dijawab). */
  function interrupt(p) {
    const pn = p.panel;
    if (!pn) return;
    if (pn.phase === 'ask') pn.gate.cool[p.index] = Math.max(pn.gate.cool[p.index], CANCEL_COOLDOWN);
    p.panel = null;
  }

  function cancel(p) {
    if (!p.panel || p.panel.phase !== 'ask') return;
    p.panel.gate.cool[p.index] = CANCEL_COOLDOWN;
    p.panel = null; p.invuln = Math.max(p.invuln, 0.8);
    SFX.play('back');
  }

  /* Dipanggil sekali per frame dengan tombol 'baru ditekan' milik pemain tersebut. */
  function handleInput(p) {
    const k = KEYMAP[p.index], pn = p.panel;
    if (!pn) { if (Input.wasPressed(k.act)) tryOpen(p); return; }
    if (pn.phase !== 'ask') return;
    if (Input.wasPressed(k.left) || Input.wasPressed(k.right)) pn.sel ^= 1;   // pilihan 2x2: kolom
    if (Input.wasPressed(k.up) || Input.wasPressed(k.down)) pn.sel ^= 2;      //             baris
    if (Input.wasPressed(k.act)) answer(p, pn.sel);
    else if (Input.wasPressed(k.jump)) { Input.consumeLatch(k.jump); cancel(p); }   // batal tanpa penalti jawaban
  }

  function update(dt) {
    for (const g of Level.gates) {
      if (g.alias) continue;                                   // alias berbagi array jeda dengan gerbang utama
      g.cool[0] = Math.max(0, g.cool[0] - dt);
      g.cool[1] = Math.max(0, g.cool[1] - dt);
    }
    for (const p of players) {
      const pn = p.panel;
      if (!pn) continue;
      if (pn.phase === 'ask') {
        pn.timeLeft -= dt;
        if (pn.timeLeft <= 0) { pn.timeLeft = 0; answer(p, -1); }
      } else {
        pn.fbTimer -= dt;
        if (pn.fbTimer <= 0) { p.panel = null; p.invuln = Math.max(p.invuln, 0.8); }   // jeda aman singkat setelah selesai menjawab
      }
    }
  }

  /* Tata letak panel: di TENGAH arena. Online: pemain hanya melihat soalnya sendiri (satu panel di tengah).
     Room Master & mode lokal 1 perangkat: kedua panel berdampingan di tengah (P1 kiri, P2 kanan). */
  const K = 1.2;                                  // panel diperbesar agar mudah dibaca & diketuk di HP
  function bothShown() { return !Online.on || Online.master; }
  function panelRect(p) {
    const w = PW * K, h = PH * K, gap = 16;
    const x = bothShown() ? (p.index === 0 ? CONFIG.W / 2 - gap / 2 - w : CONFIG.W / 2 + gap / 2) : Math.round((CONFIG.W - w) / 2);
    const y = Math.round((CONFIG.H - h) / 2);     // koordinat layar = koordinat arena (tidak ada strip)
    return { x, y, w, h };
  }
  function optionRect(r, i) {                      // r bisa berukuran desain (k=1) atau layar (k=K)
    const k = r.w / PW, col = i % 2, row = (i / 2) | 0, w = r.w / 2 - 21 * k;
    return { x: r.x + 14 * k + col * (w + 14 * k), y: r.y + (74 + row * 44) * k, w, h: 36 * k };
  }

  return { reset, nearGate, tryOpen, answer, cancel, interrupt, handleInput, update, panelRect, optionRect, tierFor };
})();

/* ---------------------------- SCORE, COLLECTIBLES, MATCH ---------------------------- */
/* Aturan skor: SEMUA poin masuk lewat satu pintu, Score.award, yang menambah p.score dan rinciannya
   (p.pts) sekaligus, sehingga p.score selalu sama dengan jumlah rincian.
     koin +10, gem +50, jawaban benar = poin matematika (tahap 3),
     garis akhir = 500 + sisa waktu (detik) x 5.
   Anti-ganda:
     - collectible hanya bisa diambil saat aktif; langsung dinonaktifkan pada langkah yang sama
       dan baru muncul lagi setelah beberapa detik, jadi satu sentuhan = satu award;
     - bila dua pemain menyentuhnya pada langkah yang sama, hanya yang terdekat yang mendapat;
     - garis akhir dinilai sekali per pemain (p.finished) dan hasil pertandingan dikunci sekali. */
const Score = (() => {
  const pool = [];
  for (let i = 0; i < CONFIG.POPUPS; i++) pool.push({ active: false, x: 0, y: 0, text: '', color: '#fff', life: 0 });
  let next = 0;
  function popup(x, y, str, color) {
    const q = pool[next]; next = (next + 1) % pool.length;       // cincin: menimpa yang tertua, tanpa alokasi
    q.active = true; q.x = x; q.y = y; q.text = str; q.color = color; q.life = 1.0;
  }
  function award(p, pts, type, x, y) {
    if (!Number.isFinite(pts) || pts <= 0) return false;
    pts = Math.round(pts);
    p.score += pts;
    p.pts[type] += pts;
    if (type === 'math') p.bonus += pts;
    popup(x, y, '+' + pts, p.accent);
    Online.emit('pop', x, y, '+' + pts, p.index);
    Online.cur = p.index;
    if (type === 'coin') FX.event('coin', x, y);
    else if (type === 'gem') FX.event('gem', x, y);
    Online.cur = -1;
    return true;
  }
  const mult = p => Math.min(CONFIG.COMBO_MAX, 1 + p.streak);   // pengali koin/gem dari kombo jawaban benar
  function update(dt) {
    for (const p of players) {
      if (p.comboT > 0) { p.comboT -= dt; if (p.comboT <= 0) { p.comboT = 0; p.streak = 0; } }
    }
    for (const q of pool) {
      if (!q.active) continue;
      q.life -= dt; q.y -= 36 * dt;
      if (q.life <= 0) q.active = false;
    }
  }
  function reset() { for (const q of pool) q.active = false; next = 0; }
  return { award, update, reset, pool, mult, popup };
})();

const Collectibles = (() => {
  function touches(c, p) {
    const px = p.x + 3, py = p.y + 2, pw = p.w - 6, ph = p.h - 4;           // kotak pemain sedikit diperkecil
    const cx = Math.max(px, Math.min(c.x, px + pw)), cy = Math.max(py, Math.min(c.y, py + ph));
    const dx = c.x - cx, dy = c.y - cy;
    return dx * dx + dy * dy <= c.r * c.r;
  }
  function reset() { for (const c of Level.collectibles) { c.active = true; c.respawn = 0; } }
  function update(dt) {
    for (const c of Level.collectibles) {
      if (!c.active) {
        c.respawn -= dt;
        if (c.respawn <= 0) { c.active = true; c.respawn = 0; }
        continue;
      }
      let best = null, bestD = Infinity;
      for (const p of ACT) {
        if (!touches(c, p) && !(Online.master && p.ym < p.y && touches(c, { x: p.x, y: p.ym, w: p.w, h: p.h }))) continue;
        const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2), d = dx * dx + dy * dy;
        if (d < bestD || (d === bestD && best && p.score < best.score)) { best = p; bestD = d; }
      }
      if (!best) continue;
      c.active = false;
      c.respawn = c.type === 'gem' ? CONFIG.GEM_RESPAWN : CONFIG.COIN_RESPAWN;
      if (c.type === 'gem') { best.gems++; Score.award(best, CONFIG.GEM_VALUE * Score.mult(best) * (Tension.finale ? 2 : 1), 'gem', c.x, c.y - 10); }
      else { best.coins++; Score.award(best, CONFIG.COIN_VALUE * Score.mult(best) * (Tension.finale ? 2 : 1), 'coin', c.x, c.y - 10); }
    }
  }
  return { reset, update, touches };
})();

/* Palu (gaya Donkey Kong). Ambil palu: 10 detik menghancurkan tong & api di depan (dan di atas kepala);
   selama itu tidak bisa lompat atau memanjat. Terkena rintangan dari belakang melepas palu. */
const Hammers = (() => {
  function reset() { for (const h of Level.hammers) { h.active = true; h.respawn = 0; } }
  function inZone(p, x, y, r) {
    if (p.hammer <= 0 || p.climbing || p.panel || p.hitTimer > 0) return false;
    const f = p.facing, x0 = f > 0 ? p.x + p.w - 6 : p.x - 32, x1 = f > 0 ? p.x + p.w + 32 : p.x + 6;
    return x > x0 - r && x < x1 + r && y > p.y - 18 - r && y < p.y + p.h + r;
  }
  function smash(p, pts, x, y) { Score.award(p, pts, 'skill', x, y - 10); FX.event('shieldBlock', x, y); }
  function update(dt) {
    for (const h of Level.hammers) {
      if (!h.active) { h.respawn -= dt; if (h.respawn <= 0) { h.active = true; h.respawn = 0; } continue; }
      for (const p of ACT) {
        if (p.hammer > 0 || p.climbing || p.panel || p.hitTimer > 0) continue;
        const cx = p.x + p.w / 2, feet = p.y + p.h;
        if (Math.abs(cx - h.x) < 16 && Math.abs(feet - h.support) < 10) {
          p.hammer = CONFIG.HAMMER_TIME; h.active = false; h.respawn = CONFIG.HAMMER_RESPAWN;
          Online.cur = p.index; FX.event('boost', cx, p.y + p.h / 2); Online.cur = -1;
          break;
        }
      }
    }
  }
  return { reset, update, inZone, smash };
})();

/* Aturan pertandingan:
   1. Pemain pertama yang berdiri di zona garis akhir (setelah membuka gerbang akhir) menang langsung
      dan mendapat bonus garis akhir.
   2. Bila KEDUANYA tiba pada langkah simulasi yang sama (1/120 detik), keduanya mendapat bonus yang sama
      dan pemenang ditentukan skor total; skor sama = SERI.
   3. Bila waktu habis sebelum ada yang tiba, skor total tertinggi menang; skor sama = SERI.
   Hasil dikunci sekali (result) sehingga tidak ada penilaian ganda. */
const Match = (() => {
  let result = null;
  const duration = () => DURATIONS[settings.duration];
  function atFinish(p) {
    const f = Level.finish;
    if (!f.gate.open[p.index] || !p.onGround || p.climbing) return false;
    if (Math.abs(p.y + p.h - f.y) > 0.5) return false;
    const cx = p.x + p.w / 2;
    return cx >= f.x0 && cx <= f.x1;
  }
  function byScore() {
    const a = players[0].score, b = players[1].score;
    return a > b ? 0 : b > a ? 1 : -1;
  }
  function evaluate(elapsed) {
    if (result) return result;
    const fin = [];
    for (const p of ACT) if (!p.finished && atFinish(p)) fin.push(p);
    if (fin.length) {
      const bonus = CONFIG.FINISH_BONUS + Math.floor(Math.max(0, duration() - elapsed)) * CONFIG.TIME_BONUS_PER_SEC;
      for (const p of fin) { p.finished = true; Score.award(p, bonus, 'finish', p.x + p.w / 2, p.y - 10); }
      result = fin.length === 2 ? { reason: 'both', winner: byScore() } : { reason: 'finish', winner: fin[0].index };
      result.elapsed = elapsed;
      return result;
    }
    if (elapsed >= duration()) { result = { reason: 'time', winner: byScore(), elapsed }; return result; }
    return null;
  }
  function reset() { result = null; }
  return { evaluate, reset, atFinish, remaining: e => Math.max(0, duration() - e), duration, get result() { return result; } };
})();

/* ---------------------------- SPRITES (seni piksel prosedural) ---------------------------- */
/* Semua sprite digambar piksel demi piksel lewat kode (tanpa gambar eksternal), diberi kontur gelap,
   lalu diperbesar 2x tanpa penghalusan. Dibuat sekali di Sprites.init(), lalu hanya di-blit saat render.
   Ukuran logis karakter 12x17 piksel -> 24x34 di layar = kotak tabrakan fisika (kontur menambah 2 px/sisi). */
const Sprites = (() => {
  const S = { ready: false, chimneys: [], player: [{}, {}], coin: [], gem: [] };
  const OUT = '#1a0f12';
  const PAL = [
    { main: '#e63946', dark: '#a3202c', acc: '#ffd23f', pants: '#2a3b8f', hat: 'cap' },
    { main: '#3a86ff', dark: '#1f4fb0', acc: '#7dff7a', pants: '#3a2a6b', hat: 'beanie' }
  ];
  const SKIN = '#ffd7a8', SKIN_S = '#e3a66e', WHITE = '#ffffff', BOOT = '#5a3515', EYE = '#161616', HAIR = '#5b3a1e', MUS = '#4a2a12';
  const FRAMES = ['idle', 'walkA', 'walkB', 'jump', 'climbA', 'climbB', 'hit', 'win'];

  const inside = (x, y, cx, cy, rx, ry) => { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; return dx * dx + dy * dy <= 1; };
  function ellipse(px, col, cx, cy, rx, ry, w, h) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (inside(x, y, cx, cy, rx, ry)) px(col, x, y);
  }

  /* ----- karakter ----- */
  function drawLegs(px, pal, n) {
    const P = pal.pants, B = BOOT;
    switch (n) {
      case 'walkA':  px(P, 2, 13, 2, 2); px(B, 1, 15, 3, 2); px(P, 7, 13, 2, 1); px(B, 7, 14, 3, 2); break;
      case 'walkB':  px(P, 4, 13, 2, 2); px(B, 3, 15, 3, 2); px(P, 6, 13, 2, 1); px(B, 6, 14, 3, 1); break;
      case 'jump':   px(P, 3, 13, 2, 1); px(B, 2, 14, 3, 2); px(P, 6, 13, 3, 1); px(B, 8, 13, 3, 2); break;
      case 'climbA': px(P, 3, 12, 2, 2); px(B, 3, 14, 3, 2); px(P, 6, 13, 2, 2); px(B, 6, 15, 3, 2); break;
      case 'climbB': px(P, 6, 12, 2, 2); px(B, 6, 14, 3, 2); px(P, 3, 13, 2, 2); px(B, 3, 15, 3, 2); break;
      case 'hit':    px(P, 2, 13, 2, 2); px(B, 1, 15, 3, 2); px(P, 7, 13, 2, 2); px(B, 7, 15, 3, 2); break;
      default:       px(P, 3, 13, 2, 2); px(B, 3, 15, 3, 2); px(P, 6, 13, 2, 2); px(B, 6, 15, 3, 2);
    }
  }
  function drawArms(px, pal, n) {
    const M = pal.main, H = WHITE;
    const down = (x) => { px(M, x, 9, 1, 2); px(H, x, 11); };
    const up = (x, hi) => { px(M, x, 8, 1, 1); px(M, x, 7, 1, 1); px(H, x, hi ? 5 : 6); if (hi) px(M, x, 6, 1, 1); };
    switch (n) {
      case 'walkA': px(M, 9, 9, 1, 1); px(M, 10, 10, 1, 1); px(H, 10, 11); px(M, 2, 9, 1, 1); px(M, 1, 10, 1, 1); px(H, 1, 11); break;
      case 'jump':  up(2, false); up(9, false); break;
      case 'win':   up(2, true); up(9, true); break;
      case 'climbA': up(2, false); down(9); break;
      case 'climbB': down(2); up(9, false); break;
      case 'hit':   px(M, 1, 9, 2, 1); px(H, 0, 9); px(M, 9, 9, 2, 1); px(H, 11, 9); break;
      default:      down(2); down(9);
    }
  }
  function playerFrame(pi, name) {
    const pal = PAL[pi], back = name === 'climbA' || name === 'climbB';
    const raw = Gfx.sprite(12, 17, (g, px) => {
      drawLegs(px, pal, name);
      // badan: kaos + overall + kancing
      px(pal.main, 3, 8, 6, 3);
      px(pal.pants, 3, 11, 6, 2);
      px(pal.pants, 4, 8, 1, 3); px(pal.pants, 7, 8, 1, 3);
      if (!back) { px(pal.acc, 4, 10); px(pal.acc, 7, 10); }
      drawArms(px, pal, name);
      // kepala
      px(SKIN, 3, 3, 6, 5);
      if (back) {
        px(HAIR, 3, 4, 6, 3);
      } else {
        px(SKIN_S, 3, 5);
        if (name === 'hit') { px(EYE, 6, 5, 2, 1); px('#8a1c1c', 7, 7, 2, 1); }
        else { px(EYE, 7, 5); }
        px(SKIN, 9, 6);
        if (pal.hat === 'cap') px(MUS, 6, 7, 4, 1);
        else if (name === 'win') px(WHITE, 7, 7, 2, 1);
        else if (name !== 'hit') px(SKIN_S, 7, 7, 2, 1);
        if (name === 'win' && pal.hat === 'cap') px(WHITE, 6, 7, 3, 1);
      }
      // topi: P1 = cap bertopi lebar, P2 = kupluk berpompom (siluet berbeda)
      if (pal.hat === 'cap') {
        px(pal.main, 4, 1, 4, 1); px(pal.main, 3, 2, 6, 2); px(pal.acc, 5, 2);
        if (back) px(pal.dark, 3, 3, 6, 1); else px(pal.dark, 7, 3, 5, 1);
      } else {
        px(pal.acc, 5, 0, 2, 1); px(pal.main, 4, 1, 4, 1); px(pal.main, 3, 2, 6, 1); px(pal.acc, 3, 3, 6, 1);
      }
    });
    return Gfx.scale(Gfx.outline(raw, OUT), 2);
  }

  /* ----- benda ----- */
  function barrelSprite() {
    const raw = Gfx.sprite(11, 11, (g, px) => {
      ellipse(px, '#a8692f', 5.5, 5.5, 5.5, 5.5, 11, 11);
      for (let y = 0; y < 11; y++) {
        for (let x = 0; x < 11; x++) {
          if (!inside(x, y, 5.5, 5.5, 5.5, 5.5)) continue;
          if (x === 3 || x === 7) px('#7a4a1e', x, y);
          if (y === 2 || y === 8) px('#8a9099', x, y);
          if (y === 3 || y === 7) px('#5b5f66', x, y);
        }
      }
      px('#d49a5a', 2, 1); px('#d49a5a', 3, 1); px('#d49a5a', 1, 4); px('#ffffff', 2, 2);
    });
    return Gfx.scale(Gfx.outline(raw, '#2b1808'), 2);
  }

/* ---------------------------- ONLINE (satu dunia di Room Master; P1 & P2 bermain di dalamnya) ---------------------------- */
/* =====================================================================
   NetSession — koneksi antar-pemain.
   Utama : WebRTC DataChannel langsung antar-perangkat (tanpa server di tengah → latensi serendah mungkin).
           Dua kanal: 'r' (andal & berurutan: kejadian penting) dan 'u' (tak andal, tanpa antrean: posisi & snapshot).
   Cadangan: bila koneksi langsung tidak jadi dalam ±9 dtk, semua pesan dititipkan lewat /api/room (relay, lebih lambat).
   Topologi BINTANG: Room Master memegang satu NetSession per pemain; pemain hanya punya satu NetSession (ke Room Master).
   Server (Vercel + Redis) hanya dipakai untuk membuat/gabung ruangan, bertukar SDP/ICE, dan relay cadangan.
   ===================================================================== */
class NetSession {
  constructor(handlers) {
    this.h = handlers || {};
    this.url = '/api/room';
    this.reset();
  }
  reset() {
    this.peerRole = 'h'; this.idle = 450;
    this.code = null; this.token = null; this.role = null; this.name = ''; this.peerName = ''; this.peerJoined = false;
    this.since = 0; this.pollTimer = 0; this.stopped = true; this.failCount = 0;
    this.pc = null; this.chR = null; this.chU = null; this.pendingCands = []; this.remoteSet = false; this.rtcStarted = false;
    this.p2p = false; this.relay = false; this.ready = false; this.closed = false;
    this.relayQ = []; this.latestU = {}; this.flushing = false; this.flushTimer = 0;
    this.sigQ = []; this.sigTimer = 0;
    this.ice = null; this.iceReady = null;
    this.rtt = 0; this.lastRx = 0; this.pingTimer = 0; this.watchTimer = 0; this.relayTimer = 0;
    this.sentBytes = 0;
  }
  get isHost() { return this.role === 'h'; }
  get mode() { return this.p2p ? 'p2p' : (this.relay ? 'relay' : 'wait'); }

  async call(method, body, query) {
    const opt = { method: method, headers: { 'Content-Type': 'application/json' }, cache: 'no-store' };
    let u = this.url;
    if (method === 'GET') u += '?' + new URLSearchParams(query).toString(); else opt.body = JSON.stringify(body);
    let r, j = null;
    try { r = await fetch(u, opt); } catch (e) { const er = new Error('Tidak bisa menghubungi server. Periksa internet.'); er.net = true; throw er; }
    try { j = await r.json(); } catch (e) { /* bukan JSON */ }
    if (!r.ok || !j || !j.ok) {
      const er = new Error((j && j.error) || 'Server bermasalah (' + r.status + ').');
      er.status = r.status; er.gone = !!(j && j.gone); throw er;
    }
    return j;
  }

  /* ---------- ruangan ---------- */
  /** Room Master: buat ruangan; sesi ini = kanal ke Pemain 1 (peerRole '1'). */
  async create(name) {
    const j = await this.call('POST', { action: 'create', name: name });
    this.role = 'h'; this.peerRole = '1'; this.code = j.code; this.token = j.token; this.name = j.name; this.begin(); return j;
  }
  /** Room Master: kanal tambahan ke kursi pemain lain (peerRole '1' / '2'), memakai sesi host yang sama. */
  attachPeer(code, token, name, peerRole, since) {
    this.role = 'h'; this.peerRole = peerRole; this.code = code; this.token = token; this.name = name; this.idle = peerRole === '1' ? 450 : 700; this.begin(since || 0);
  }
  /** Pemain: gabung; server memberi kursi 1 (merah) atau 2 (biru). Satu-satunya lawan bicara = Room Master. */
  async join(code, name) {
    const j = await this.call('POST', { action: 'join', code: code, name: name });
    this.role = j.role; this.peerRole = 'h'; this.code = j.code; this.token = j.token; this.name = j.name; this.peerName = j.hostName; this.begin(j.base || 0); return j;
  }
  begin(since) {
    this.stopped = false; this.closed = false; this.since = since || 0;
    this.iceReady = this.call('GET', null, { action: 'ice' }).then((j) => { this.ice = j.iceServers; }).catch(() => { this.ice = [{ urls: 'stun:stun.l.google.com:19302' }]; });
    this.poll();
  }

  /* ---------- polling kotak surat (sinyal, presence, relay) ---------- */
  async poll() {
    if (this.stopped) return;
    try {
      const j = await this.call('GET', null, { code: this.code, token: this.token, since: this.since, peer: this.peerRole });
      this.since = j.n; this.failCount = 0;
      if (j.peer) await this.onPeer(j.peer);
      for (let i = 0; i < j.msgs.length; i++) await this.onMail(j.msgs[i]);
    } catch (e) {
      if (e.gone) { this.close(this.isHost ? 'Ruangan sudah tidak ada.' : 'Ruangan ditutup oleh Room Master.'); return; }
      if (++this.failCount >= 25) { this.close('Server tidak dapat dihubungi.'); return; }
    }
    if (this.stopped) return;
    const delay = this.relay && !this.p2p ? 100 : (this.p2p ? 3500 : (this.peerJoined ? 450 : this.idle));
    this.pollTimer = setTimeout(() => this.poll(), delay);
  }
  async onPeer(p) {
    if (p.joined && !this.peerJoined) {
      this.peerJoined = true; this.peerName = p.name || this.peerName;
      if (this.h.onPeer) this.h.onPeer(true, this.peerName);
      if (this.isHost) this.startRTC(true);
    } else if (!p.joined && this.peerJoined) {
      this.peerJoined = false;
      if (this.h.onPeer) this.h.onPeer(false, '');
      if (this.isHost && this.ready) this.close('Pemain keluar dari ruangan.');
    }
    if (p.name) this.peerName = p.name;
  }
  async onMail(m) {
    if (m.t === 'sig') await this.onSig(m.d);
    else if (m.t === 'rl') {
      if (!this.p2p && !this.relay) this.enableRelay();     // lawan sudah pakai relay → ikut, supaya balasan kita juga terkirim
      const a = m.d || []; for (let i = 0; i < a.length; i++) this.onData(a[i], true);
    }
    else if (m.t === 'bye') { this.close(this.isHost ? 'Pemain keluar dari permainan.' : 'Room Master keluar. Ruangan ditutup.'); }
  }

  /* ---------- WebRTC ---------- */
  async startRTC(offerer) {
    if (this.rtcStarted || this.stopped) return;
    this.rtcStarted = true;
    if (typeof RTCPeerConnection === 'undefined') { this.enableRelay(); return; }
    await this.iceReady;
    if (this.stopped) return;
    let pc;
    try { pc = this.pc = new RTCPeerConnection({ iceServers: this.ice, iceCandidatePoolSize: 2 }); }
    catch (e) { this.enableRelay(); return; }
    pc.onicecandidate = (e) => { if (e.candidate) this.sendSig({ c: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate }); };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if ((s === 'failed' || s === 'closed') && this.p2p) { this.p2p = false; this.enableRelay(); this.status(); }
      else if (s === 'failed') this.enableRelay();
    };
    if (offerer) {
      this.chR = pc.createDataChannel('r', { ordered: true });
      this.chU = pc.createDataChannel('u', { ordered: false, maxRetransmits: 0 });
      this.bind();
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        this.sendSig({ sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
      } catch (e) { this.enableRelay(); }
    } else {
      pc.ondatachannel = (e) => { if (e.channel.label === 'r') this.chR = e.channel; else this.chU = e.channel; this.bind(); };
    }
    clearTimeout(this.relayTimer);
    this.relayTimer = setTimeout(() => { if (!this.p2p && !this.stopped) this.enableRelay(); }, 9000);   // koneksi langsung tak jadi → relay
  }
  async onSig(d) {
    if (!d) return;
    if (d.sdp) {
      if (!this.rtcStarted) await this.startRTC(false);
      const pc = this.pc; if (!pc) return;
      try {
        await pc.setRemoteDescription(d.sdp); this.remoteSet = true;
        for (const c of this.pendingCands) { try { await pc.addIceCandidate(c); } catch (e) { /* abaikan */ } }
        this.pendingCands = [];
        if (d.sdp.type === 'offer') {
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          this.sendSig({ sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
        }
      } catch (e) { this.enableRelay(); }
    } else if (d.c) {
      if (this.pc && this.remoteSet) { try { await this.pc.addIceCandidate(d.c); } catch (e) { /* abaikan */ } } else this.pendingCands.push(d.c);
    }
  }
  sendSig(d) {                                  // kandidat ICE digabung dalam satu POST agar hemat request
    this.sigQ.push({ t: 'sig', d: d });
    if (this.sigTimer) return;
    this.sigTimer = setTimeout(() => {
      this.sigTimer = 0;
      const msgs = this.sigQ.splice(0);
      if (msgs.length && !this.stopped) this.call('POST', { action: 'send', code: this.code, token: this.token, to: this.peerRole, msgs: msgs }).catch(() => { });
    }, 60);
  }
  bind() {
    [this.chR, this.chU].forEach((ch) => {
      if (!ch || ch._nb) return;
      ch._nb = true;
      try { ch.binaryType = 'arraybuffer'; } catch (e) { /* abaikan */ }
      ch.onmessage = (e) => this.onData(e.data, false);

  /* Jenis jalur terpilih: 'relay' = lewat server TURN (lebih lambat dari langsung), selain itu langsung antar-perangkat. */

      st.forEach((r) => { if (r.type === 'transport' && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });

  /* ---------- kirim / terima ---------- */
  /** ch: 'r' (andal) | 'u' (tak andal). Mengembalikan true bila sudah masuk jalur kirim. */
  send(ch, obj) {
    const s = JSON.stringify(obj);

  armFlush() {

    catch (e) { if (e.gone) { this.flushing = false; this.close('Ruangan ditutup.'); return; } }

  }
  onData(raw, viaRelay) {
    let m; try { m = JSON.parse(raw); } catch (e) { return; }

  /* ---------- keluar ---------- */
  farewell() {       // beri tahu server (dan lewat server: lawan) bahwa kita pergi → kursi dibebaskan / ruangan ditutup bila host

      else fetch(this.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(() => { });
    } catch (e) { /* abaikan */ }
  }
  leave() {          // keluar dengan sengaja: beri tahu lawan & bebaskan kursi
    if (!this.closed) this.farewell();

  }
  close(reason) {    // putus karena sebab luar

  teardown() {

    try { if (this.pc) { this.pc.onicecandidate = this.pc.onconnectionstatechange = null; this.pc.close(); } } catch (e) { /* abaikan */ }
    this.pc = this.chR = this.chU = null; this.p2p = false; this.relay = false;
  }
}
